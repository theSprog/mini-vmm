<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img">
<title>Session 是多个进程组的归属边界</title><desc>控制终端与 session 关联，而不是由进程 fd 0 指向何处决定。</desc>
<defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#213247"/></marker><marker id="muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#52677c"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#2463a3"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#237b68"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#a35c18"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#b34848"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#667b90"/></marker></defs>
<rect width="1000" height="460" rx="12" fill="#ffffff"/>
<text x="28" y="35" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#213247" text-anchor="start">Session 是多个进程组的归属边界</text>
<text x="28" y="62" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#52677c" text-anchor="start">控制终端与 session 关联，而不是由进程 fd 0 指向何处决定。</text>
<polyline points="28,76 972,76" fill="none" stroke="#667b90" stroke-width="1" stroke-linejoin="round"/>
<rect x="28" y="95" width="454" height="310" rx="8" fill="#fafcfe" stroke="#2463a3" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="41" y="119" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#2463a3" text-anchor="start">Session SID = 100</text>
<rect x="48" y="140" width="414" height="55" rx="8" fill="#eaf3fc" stroke="#2463a3" stroke-width="1.4"/>
<text x="255" y="163" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">控制终端 /dev/pts/0</text>
<text x="255" y="185" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#52677c" text-anchor="middle">foreground PGID = 100</text>
<rect x="48" y="230" width="194" height="145" rx="8" fill="#fafcfe" stroke="#237b68" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="61" y="254" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#237b68" text-anchor="start">前台进程组</text>
<rect x="268" y="230" width="194" height="145" rx="8" fill="#fafcfe" stroke="#667b90" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="281" y="254" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#667b90" text-anchor="start">后台进程组</text>
<rect x="60" y="274" width="170" height="67" rx="8" fill="#e9f6f0" stroke="#237b68" stroke-width="1.4"/>
<text x="145" y="313" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">Bash · 100</text>
<rect x="280" y="274" width="170" height="67" rx="8" fill="#f0f4f8" stroke="#667b90" stroke-width="1.4"/>
<text x="365" y="313" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">job · 200</text>
<polyline points="145,195 145,230" fill="none" stroke="#237b68" stroke-width="2" stroke-linejoin="round"/>
<polyline points="365,195 365,230" fill="none" stroke="#667b90" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
<rect x="518" y="95" width="454" height="310" rx="8" fill="#fafcfe" stroke="#2463a3" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="531" y="119" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#2463a3" text-anchor="start">Session SID = 300</text>
<rect x="538" y="140" width="414" height="55" rx="8" fill="#eaf3fc" stroke="#2463a3" stroke-width="1.4"/>
<text x="745" y="163" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">控制终端 /dev/pts/1</text>
<text x="745" y="185" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#52677c" text-anchor="middle">foreground PGID = 300</text>
<rect x="538" y="230" width="194" height="145" rx="8" fill="#fafcfe" stroke="#237b68" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="551" y="254" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#237b68" text-anchor="start">前台进程组</text>
<rect x="758" y="230" width="194" height="145" rx="8" fill="#fafcfe" stroke="#667b90" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="771" y="254" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#667b90" text-anchor="start">后台进程组</text>
<rect x="550" y="274" width="170" height="67" rx="8" fill="#e9f6f0" stroke="#237b68" stroke-width="1.4"/>
<text x="635" y="313" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">Bash · 300</text>
<rect x="770" y="274" width="170" height="67" rx="8" fill="#f0f4f8" stroke="#667b90" stroke-width="1.4"/>
<text x="855" y="313" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">job · 400</text>
<polyline points="635,195 635,230" fill="none" stroke="#237b68" stroke-width="2" stroke-linejoin="round"/>
<polyline points="855,195 855,230" fill="none" stroke="#667b90" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
<text x="28" y="442" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#52677c" text-anchor="start">/dev/tty 通过当前进程的控制终端关系解析；重定向 stdin 不会自动解除该关联。</text>
</svg>