<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img">
<title>回显与输入交付是两个独立开关</title><desc>相同的 canonical 行缓冲：是否在屏幕显示输入，由 ECHO 决定。</desc>
<defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#213247"/></marker><marker id="muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#52677c"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#2463a3"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#237b68"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#a35c18"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#b34848"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#667b90"/></marker></defs>
<rect width="1000" height="450" rx="12" fill="#ffffff"/>
<text x="28" y="35" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#213247" text-anchor="start">回显与输入交付是两个独立开关</text>
<text x="28" y="62" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#52677c" text-anchor="start">相同的 canonical 行缓冲：是否在屏幕显示输入，由 ECHO 决定。</text>
<polyline points="28,76 972,76" fill="none" stroke="#667b90" stroke-width="1" stroke-linejoin="round"/>
<rect x="28" y="95" width="454" height="305" rx="8" fill="#fafcfe" stroke="#237b68" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="41" y="119" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#237b68" text-anchor="start">普通输入 · ECHO ON</text>
<rect x="48" y="140" width="414" height="80" rx="8" fill="#17293c" stroke="#667b90" stroke-width="1.4"/>
<text x="60" y="163" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#c3d3e4" text-anchor="start">窗口（尚未按回车）</text>
<polyline points="57,173 453,173" fill="none" stroke="#667b90" stroke-width="1" stroke-linejoin="round"/>
<text x="62" y="197" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#e5f1e9" text-anchor="start">Name: Ali▌</text>
<rect x="48" y="248" width="200" height="69" rx="8" fill="#eaf3fc" stroke="#2463a3" stroke-width="1.4"/>
<text x="148" y="278" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">行缓冲：Ali</text>
<text x="148" y="300" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#52677c" text-anchor="middle">ICANON=1</text>
<rect x="273" y="248" width="189" height="69" rx="8" fill="#f0f4f8" stroke="#667b90" stroke-width="1.4"/>
<text x="367" y="278" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">应用 read()</text>
<text x="367" y="300" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#52677c" text-anchor="middle">仍在等待</text>
<polyline points="148,220 148,248" fill="none" stroke="#2463a3" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue)"/>
<polyline points="248,282 273,282" fill="none" stroke="#667b90" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
<text x="255" y="345" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#52677c" text-anchor="middle">收到 LF 后才交付</text>
<polyline points="93,248 93,220" fill="none" stroke="#237b68" stroke-width="2" stroke-linejoin="round" marker-end="url(#green)"/>
<text x="103" y="240" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#237b68" text-anchor="start">回显</text>
<rect x="518" y="95" width="454" height="305" rx="8" fill="#fafcfe" stroke="#a35c18" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="531" y="119" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#a35c18" text-anchor="start">密码输入 · ECHO OFF</text>
<rect x="538" y="140" width="414" height="80" rx="8" fill="#17293c" stroke="#667b90" stroke-width="1.4"/>
<text x="550" y="163" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#c3d3e4" text-anchor="start">窗口（尚未按回车）</text>
<polyline points="547,173 943,173" fill="none" stroke="#667b90" stroke-width="1" stroke-linejoin="round"/>
<text x="552" y="197" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#e5f1e9" text-anchor="start">Password: ▌</text>
<rect x="538" y="248" width="200" height="69" rx="8" fill="#eaf3fc" stroke="#2463a3" stroke-width="1.4"/>
<text x="638" y="278" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">行缓冲：Ali</text>
<text x="638" y="300" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#52677c" text-anchor="middle">ICANON=1</text>
<rect x="763" y="248" width="189" height="69" rx="8" fill="#f0f4f8" stroke="#667b90" stroke-width="1.4"/>
<text x="857" y="278" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">应用 read()</text>
<text x="857" y="300" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#52677c" text-anchor="middle">仍在等待</text>
<polyline points="638,220 638,248" fill="none" stroke="#2463a3" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue)"/>
<polyline points="738,282 763,282" fill="none" stroke="#667b90" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
<text x="745" y="345" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#52677c" text-anchor="middle">收到 LF 后才交付</text>
<text x="758" y="240" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#b34848" text-anchor="start">无回显</text>
<text x="28" y="432" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#52677c" text-anchor="start">窗口始终把每个键写入 master；密码不显示不代表窗口或内核没有收到字符。</text>
</svg>