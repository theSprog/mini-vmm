<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img">
<title>同一输入端点，字节和信号是不同接口</title><desc>ISIG 决定 VINTR 是否被解释成信号；应用不调用 read 也能收到 SIGINT。</desc>
<defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#213247"/></marker><marker id="muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#52677c"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#2463a3"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#237b68"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#a35c18"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#b34848"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#667b90"/></marker></defs>
<rect width="1000" height="440" rx="12" fill="#ffffff"/>
<text x="28" y="35" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#213247" text-anchor="start">同一输入端点，字节和信号是不同接口</text>
<text x="28" y="62" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#52677c" text-anchor="start">ISIG 决定 VINTR 是否被解释成信号；应用不调用 read 也能收到 SIGINT。</text>
<polyline points="28,76 972,76" fill="none" stroke="#667b90" stroke-width="1" stroke-linejoin="round"/>
<rect x="28" y="180" width="190" height="75" rx="8" fill="#eaf3fc" stroke="#2463a3" stroke-width="1.4"/>
<text x="123" y="213" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">Master</text>
<text x="123" y="235" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#52677c" text-anchor="middle">输入 a / 0x03</text>
<rect x="270" y="95" width="460" height="295" rx="8" fill="#fafcfe" stroke="#2463a3" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="283" y="119" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#2463a3" text-anchor="start">Slave · N_TTY</text>
<rect x="290" y="140" width="420" height="55" rx="8" fill="#fff3df" stroke="#a35c18" stroke-width="1.4"/>
<text x="500" y="163" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">N_TTY 输入处理</text>
<text x="500" y="185" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#52677c" text-anchor="middle">按 termios 检查 ISIG / VINTR</text>
<rect x="515" y="228" width="195" height="64" rx="8" fill="#eaf3fc" stroke="#2463a3" stroke-width="1.4"/>
<text x="612" y="254" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">输入队列</text>
<text x="612" y="276" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#52677c" text-anchor="middle">a 或普通 0x03</text>
<rect x="515" y="315" width="195" height="64" rx="8" fill="#fff3df" stroke="#a35c18" stroke-width="1.4"/>
<text x="612" y="341" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">信号机制</text>
<text x="612" y="363" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#52677c" text-anchor="middle">SIGINT</text>
<polyline points="218,217 244,217 244,167 290,167" fill="none" stroke="#2463a3" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue)"/>
<polyline points="612,195 612,228" fill="none" stroke="#2463a3" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue)"/>
<polyline points="480,195 480,347 515,347" fill="none" stroke="#a35c18" stroke-width="2" stroke-linejoin="round" marker-end="url(#orange)"/>
<rect x="778" y="228" width="194" height="64" rx="8" fill="#e9f6f0" stroke="#237b68" stroke-width="1.4"/>
<text x="875" y="254" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">read(slave)</text>
<text x="875" y="276" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#52677c" text-anchor="middle">应用取字节</text>
<rect x="778" y="315" width="194" height="64" rx="8" fill="#fff3df" stroke="#a35c18" stroke-width="1.4"/>
<text x="875" y="341" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">前台进程组</text>
<text x="875" y="363" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#52677c" text-anchor="middle">可在计算中</text>
<polyline points="710,260 778,260" fill="none" stroke="#2463a3" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue)"/>
<polyline points="710,347 778,347" fill="none" stroke="#a35c18" stroke-width="2" stroke-linejoin="round" marker-end="url(#orange)"/>
<text x="468" y="336" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" fill="#a35c18" text-anchor="end">ISIG 开且匹配 VINTR</text>
<text x="28" y="422" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#52677c" text-anchor="start">假设 VINTR=0x03；ISIG 关闭时该字节不因 VINTR 产生 SIGINT，仍受其他输入设置影响。</text>
</svg>