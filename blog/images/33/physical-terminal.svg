<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img">
<title>终端曾是一台独立的输入输出设备</title><desc>分时主机中的多个进程共享计算资源，但每个用户拥有自己的字符交互端点。</desc>
<defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#213247"/></marker><marker id="muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#52677c"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#2463a3"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#237b68"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#a35c18"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#b34848"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#667b90"/></marker></defs>
<rect width="1000" height="440" rx="12" fill="#ffffff"/>
<text x="28" y="35" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#213247" text-anchor="start">终端曾是一台独立的输入输出设备</text>
<text x="28" y="62" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#52677c" text-anchor="start">分时主机中的多个进程共享计算资源，但每个用户拥有自己的字符交互端点。</text>
<polyline points="28,76 972,76" fill="none" stroke="#667b90" stroke-width="1" stroke-linejoin="round"/>
<rect x="28" y="95" width="475" height="300" rx="8" fill="#fafcfe" stroke="#2463a3" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="41" y="119" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#2463a3" text-anchor="start">分时 Unix 主机</text>
<rect x="50" y="137" width="430" height="55" rx="8" fill="#eaf3fc" stroke="#2463a3" stroke-width="1.4"/>
<text x="265" y="170" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">CPU / RAM / Unix 内核</text>
<rect x="50" y="215" width="230" height="65" rx="8" fill="#e9f6f0" stroke="#237b68" stroke-width="1.4"/>
<text x="165" y="253" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">用户 A 的 Shell</text>
<rect x="300" y="215" width="180" height="65" rx="8" fill="#e9f6f0" stroke="#237b68" stroke-width="1.4"/>
<text x="390" y="243" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">字符设备 0</text>
<text x="390" y="265" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#52677c" text-anchor="middle">串行线路 0</text>
<polyline points="280,247 300,247" fill="none" stroke="#237b68" stroke-width="2" stroke-linejoin="round" marker-end="url(#green)" marker-start="url(#green)"/>
<polyline points="480,247 635,247" fill="none" stroke="#237b68" stroke-width="2" stroke-linejoin="round" marker-end="url(#green)" marker-start="url(#green)"/>
<rect x="635" y="195" width="337" height="82" rx="8" fill="#17293c" stroke="#667b90" stroke-width="1.4"/>
<text x="647" y="218" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#c3d3e4" text-anchor="start">Teletype / 视频终端 A</text>
<polyline points="644,228 963,228" fill="none" stroke="#667b90" stroke-width="1" stroke-linejoin="round"/>
<text x="649" y="252" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#e5f1e9" text-anchor="start">键盘输入 / 纸面或屏幕输出</text>
<rect x="50" y="305" width="230" height="65" rx="8" fill="#fff3df" stroke="#a35c18" stroke-width="1.4"/>
<text x="165" y="343" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">用户 B 的 Shell</text>
<rect x="300" y="305" width="180" height="65" rx="8" fill="#fff3df" stroke="#a35c18" stroke-width="1.4"/>
<text x="390" y="333" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">字符设备 1</text>
<text x="390" y="355" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#52677c" text-anchor="middle">串行线路 1</text>
<polyline points="280,337 300,337" fill="none" stroke="#a35c18" stroke-width="2" stroke-linejoin="round" marker-end="url(#orange)" marker-start="url(#orange)"/>
<polyline points="480,337 635,337" fill="none" stroke="#a35c18" stroke-width="2" stroke-linejoin="round" marker-end="url(#orange)" marker-start="url(#orange)"/>
<rect x="635" y="285" width="337" height="82" rx="8" fill="#17293c" stroke="#667b90" stroke-width="1.4"/>
<text x="647" y="308" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#c3d3e4" text-anchor="start">Teletype / 视频终端 B</text>
<polyline points="644,318 963,318" fill="none" stroke="#667b90" stroke-width="1" stroke-linejoin="round"/>
<text x="649" y="342" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#e5f1e9" text-anchor="start">键盘输入 / 纸面或屏幕输出</text>
<text x="28" y="422" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#52677c" text-anchor="start">terminal 是人机交互端点，Shell 是运行在主机上的命令解释器；二者不是同一事物。</text>
</svg>