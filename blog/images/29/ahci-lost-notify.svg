<svg xmlns="http://www.w3.org/2000/svg" width="960" height="325" viewBox="0 0 960 325" role="img" aria-labelledby="title"><title id="title">AHCI 案例：状态变化被 active 压缩</title><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1763a6"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f70"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a45d12"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b54343"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#66788a"/></marker></defs><rect width="960" height="100%" rx="14" fill="#fbfcfe" stroke="#d6e0e9"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="28" y="38" font-size="24" text-anchor="start" fill="#20334a" font-weight="600">AHCI 案例：状态变化被 active 压缩</text><text x="28" y="65" font-size="15" text-anchor="start" fill="#52667b" font-weight="400">假设端口 0 / 1 都允许中断；驱动按最初读取的 IS 处理。</text><text x="270" y="101" font-size="15" text-anchor="middle" fill="#20334a" font-weight="400">初始</text><path d="M 270 112 V 175 M 270 203 V 218 M 270 251 V 261" fill="none" stroke="#66788a" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="232" y="125" width="76" height="40" rx="8" fill="#e9f2fb" stroke="#1763a6" stroke-width="1.4"/><text x="270" y="151" font-size="20" text-anchor="middle" fill="#1763a6" font-weight="600" font-family="Consolas, DejaVu Sans Mono, monospace">00</text><text x="270" y="195" font-size="20" text-anchor="middle" fill="#20334a" font-weight="600" font-family="Consolas, DejaVu Sans Mono, monospace">0</text><text x="475" y="101" font-size="15" text-anchor="middle" fill="#20334a" font-weight="400">Port 0 完成</text><path d="M 475 112 V 175 M 475 203 V 218 M 475 251 V 261" fill="none" stroke="#66788a" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="437" y="125" width="76" height="40" rx="8" fill="#e9f2fb" stroke="#1763a6" stroke-width="1.4"/><text x="475" y="151" font-size="20" text-anchor="middle" fill="#1763a6" font-weight="600" font-family="Consolas, DejaVu Sans Mono, monospace">01</text><text x="475" y="195" font-size="20" text-anchor="middle" fill="#20334a" font-weight="600" font-family="Consolas, DejaVu Sans Mono, monospace">1</text><text x="680" y="101" font-size="15" text-anchor="middle" fill="#20334a" font-weight="400">Port 1 完成</text><path d="M 680 112 V 175 M 680 203 V 218 M 680 251 V 261" fill="none" stroke="#66788a" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="642" y="125" width="76" height="40" rx="8" fill="#e9f2fb" stroke="#1763a6" stroke-width="1.4"/><text x="680" y="151" font-size="20" text-anchor="middle" fill="#1763a6" font-weight="600" font-family="Consolas, DejaVu Sans Mono, monospace">11</text><text x="680" y="195" font-size="20" text-anchor="middle" fill="#20334a" font-weight="600" font-family="Consolas, DejaVu Sans Mono, monospace">1</text><text x="885" y="101" font-size="15" text-anchor="middle" fill="#20334a" font-weight="400">清 Port 0</text><path d="M 885 112 V 175 M 885 203 V 218 M 885 251 V 261" fill="none" stroke="#66788a" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="847" y="125" width="76" height="40" rx="8" fill="#e9f2fb" stroke="#1763a6" stroke-width="1.4"/><text x="885" y="151" font-size="20" text-anchor="middle" fill="#1763a6" font-weight="600" font-family="Consolas, DejaVu Sans Mono, monospace">10</text><text x="885" y="195" font-size="20" text-anchor="middle" fill="#20334a" font-weight="600" font-family="Consolas, DejaVu Sans Mono, monospace">1</text><text x="30" y="150" font-size="17" text-anchor="start" fill="#20334a" font-weight="400" font-family="Consolas, DejaVu Sans Mono, monospace">Global IS</text><text x="30" y="194" font-size="17" text-anchor="start" fill="#20334a" font-weight="400" font-family="Consolas, DejaVu Sans Mono, monospace">active</text><text x="30" y="242" font-size="17" text-anchor="start" fill="#20334a" font-weight="400">错误 MSI</text><text x="270" y="242" font-size="17" text-anchor="middle" fill="#52667b" font-weight="400">—</text><text x="475" y="242" font-size="17" text-anchor="middle" fill="#087f70" font-weight="600">发送</text><text x="680" y="242" font-size="17" text-anchor="middle" fill="#52667b" font-weight="400">—</text><text x="885" y="242" font-size="17" text-anchor="middle" fill="#52667b" font-weight="400">—</text><text x="480" y="296" font-size="16" text-anchor="middle" fill="#b54343" font-weight="400">01 → 11 → 10 都不是 active 的上升沿；Port 1 可能没有下一次通知。</text></g></svg>