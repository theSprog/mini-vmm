<svg xmlns="http://www.w3.org/2000/svg" width="960" height="316" viewBox="0 0 960 316" role="img" aria-labelledby="title"><title id="title">中断模式切换：输入请求不变，输出电平必须重算</title><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1763a6"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f70"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a45d12"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b54343"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#66788a"/></marker></defs><rect width="960" height="100%" rx="14" fill="#fbfcfe" stroke="#d6e0e9"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="28" y="38" font-size="24" text-anchor="start" fill="#20334a" font-weight="600">中断模式切换：输入请求不变，输出电平必须重算</text><text x="28" y="65" font-size="15" text-anchor="start" fill="#52667b" font-weight="400">假设 intx_pin 存在、INTx Disable = 0。</text><rect x="30" y="91" width="215" height="66" rx="8" fill="#e9f2fb" stroke="#1763a6" stroke-width="1.4"/><text x="137.5" y="117.5" font-size="18" text-anchor="middle" fill="#1763a6" font-weight="600">设备请求</text><text x="137.5" y="142.5" font-size="15" text-anchor="middle" fill="#20334a" font-weight="400">intx_level = 1</text><polyline points="245,124 335,124" fill="none" stroke="#1763a6" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="335" y="91" width="280" height="66" rx="8" fill="#fff2dc" stroke="#a45d12" stroke-width="1.4"/><text x="475.0" y="117.5" font-size="18" text-anchor="middle" fill="#a45d12" font-weight="600">MSI Enable = 1</text><text x="475.0" y="142.5" font-size="15" text-anchor="middle" fill="#20334a" font-weight="400">阻断 INTx</text><polyline points="615,124 705,124" fill="none" stroke="#a45d12" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#amber)"/><rect x="705" y="91" width="225" height="66" rx="8" fill="#fff2dc" stroke="#a45d12" stroke-width="1.4"/><text x="817.5" y="130.0" font-size="18" text-anchor="middle" fill="#a45d12" font-weight="600">INTx Output = 0</text><rect x="30" y="191" width="215" height="66" rx="8" fill="#e9f2fb" stroke="#1763a6" stroke-width="1.4"/><text x="137.5" y="217.5" font-size="18" text-anchor="middle" fill="#1763a6" font-weight="600">设备请求</text><text x="137.5" y="242.5" font-size="15" text-anchor="middle" fill="#20334a" font-weight="400">intx_level = 1</text><polyline points="245,224 335,224" fill="none" stroke="#1763a6" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="335" y="191" width="280" height="66" rx="8" fill="#e4f5ef" stroke="#087f70" stroke-width="1.4"/><text x="475.0" y="217.5" font-size="18" text-anchor="middle" fill="#087f70" font-weight="600">MSI Enable = 0</text><text x="475.0" y="242.5" font-size="15" text-anchor="middle" fill="#20334a" font-weight="400">允许 INTx</text><polyline points="615,224 705,224" fill="none" stroke="#087f70" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#green)"/><rect x="705" y="191" width="225" height="66" rx="8" fill="#e4f5ef" stroke="#087f70" stroke-width="1.4"/><text x="817.5" y="230.0" font-size="18" text-anchor="middle" fill="#087f70" font-weight="600">INTx Output = 1</text><text x="480" y="294" font-size="16" text-anchor="middle" fill="#52667b" font-weight="400">配置写本身也会改变输出；不必等待下一次设备事件。</text></g></svg>