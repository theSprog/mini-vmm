<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title"><title id="title">MSI-X：屏蔽的是通知，不是事件</title><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1763a6"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f70"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a45d12"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b54343"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#66788a"/></marker></defs><rect width="960" height="100%" rx="14" fill="#fbfcfe" stroke="#d6e0e9"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="28" y="38" font-size="24" text-anchor="start" fill="#20334a" font-weight="600">MSI-X：屏蔽的是通知，不是事件</text><text x="28" y="65" font-size="15" text-anchor="start" fill="#52667b" font-weight="400">简化状态机：MSI-X 已启用，且状态转换正确同步。</text><rect x="30" y="117" width="180" height="70" rx="8" fill="#eff3f7" stroke="#66788a" stroke-width="1.4"/><text x="120.0" y="145.5" font-size="18" text-anchor="middle" fill="#66788a" font-weight="600">事件需要通知</text><text x="120.0" y="170.5" font-size="15" text-anchor="middle" fill="#20334a" font-weight="400">DMA / queue</text><polyline points="210,152 260,152" fill="none" stroke="#66788a" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#gray)"/><rect x="260" y="117" width="190" height="70" rx="8" fill="#fff2dc" stroke="#a45d12" stroke-width="1.4"/><text x="355.0" y="158.0" font-size="18" text-anchor="middle" fill="#a45d12" font-weight="600">有效 Mask?</text><polyline points="450,137 555,137 555,108 645,108" fill="none" stroke="#087f70" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#green)"/><text x="520" y="126" font-size="14" text-anchor="middle" fill="#087f70" font-weight="400">否</text><rect x="645" y="80" width="265" height="56" rx="8" fill="#e4f5ef" stroke="#087f70" stroke-width="1.4"/><text x="777.5" y="114.0" font-size="18" text-anchor="middle" fill="#087f70" font-weight="600">发送 MSI-X 消息</text><polyline points="450,165 555,165 555,214 645,214" fill="none" stroke="#a45d12" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#amber)"/><text x="520" y="158" font-size="14" text-anchor="middle" fill="#a45d12" font-weight="400">是</text><rect x="645" y="185" width="265" height="60" rx="8" fill="#fff2dc" stroke="#a45d12" stroke-width="1.4"/><text x="777.5" y="208.5" font-size="18" text-anchor="middle" fill="#a45d12" font-weight="600">Pending = 1</text><text x="777.5" y="233.5" font-size="15" text-anchor="middle" fill="#20334a" font-weight="400">合并尚未发送的通知</text><polyline points="910,215 936,215 936,108 910,108" fill="none" stroke="#087f70" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#green)"/><text x="905" y="166" font-size="14" text-anchor="end" fill="#087f70" font-weight="400">Unmask</text><text x="480" y="280" font-size="16" text-anchor="middle" fill="#52667b" font-weight="400">多个事件可合并成一次通知；完成记录必须由设备状态或队列保存。</text></g></svg>