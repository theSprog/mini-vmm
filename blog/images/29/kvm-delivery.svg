<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title"><title id="title">KVM_SIGNAL_MSI：用户态向内核提交中断语义</title><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1763a6"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f70"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a45d12"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b54343"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#66788a"/></marker></defs><rect width="960" height="100%" rx="14" fill="#fbfcfe" stroke="#d6e0e9"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="28" y="38" font-size="24" text-anchor="start" fill="#20334a" font-weight="600">KVM_SIGNAL_MSI：用户态向内核提交中断语义</text><text x="28" y="65" font-size="15" text-anchor="start" fill="#52667b" font-weight="400">不是把 Data 写入 guest RAM；KVM 解析消息并更新虚拟 LAPIC。</text><rect x="25" y="121" width="200" height="78" rx="8" fill="#eff3f7" stroke="#66788a" stroke-width="1.4"/><text x="125.0" y="153.5" font-size="18" text-anchor="middle" fill="#66788a" font-weight="600">Guest Linux</text><text x="125.0" y="178.5" font-size="15" text-anchor="middle" fill="#20334a" font-weight="400">配置 PCI Capability</text><rect x="265" y="121" width="200" height="78" rx="8" fill="#e9f2fb" stroke="#1763a6" stroke-width="1.4"/><text x="365.0" y="153.5" font-size="18" text-anchor="middle" fill="#1763a6" font-weight="600">mini-vmm</text><text x="365.0" y="178.5" font-size="15" text-anchor="middle" fill="#20334a" font-weight="400">读 Address / Data</text><rect x="505" y="121" width="200" height="78" rx="8" fill="#e9f2fb" stroke="#1763a6" stroke-width="1.4"/><text x="605.0" y="153.5" font-size="18" text-anchor="middle" fill="#1763a6" font-weight="600">KVM</text><text x="605.0" y="178.5" font-size="15" text-anchor="middle" fill="#20334a" font-weight="400">解析 MSI 消息</text><rect x="745" y="121" width="190" height="78" rx="8" fill="#e4f5ef" stroke="#087f70" stroke-width="1.4"/><text x="840.0" y="153.5" font-size="18" text-anchor="middle" fill="#087f70" font-weight="600">虚拟 LAPIC</text><text x="840.0" y="178.5" font-size="15" text-anchor="middle" fill="#20334a" font-weight="400">IRR[vector] = 1</text><polyline points="225,160 265,160" fill="none" stroke="#66788a" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#gray)"/><polyline points="465,160 505,160" fill="none" stroke="#1763a6" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><polyline points="705,160 745,160" fill="none" stroke="#087f70" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#green)"/><text x="245" y="109" font-size="13" text-anchor="middle" fill="#52667b" font-weight="400">配置访问</text><text x="485" y="109" font-size="13" text-anchor="middle" fill="#1763a6" font-weight="400" font-family="Consolas, DejaVu Sans Mono, monospace">ioctl(vm_fd)</text><text x="725" y="109" font-size="13" text-anchor="middle" fill="#087f70" font-weight="400">投递</text><polyline points="840,199 840,232 480,232 480,259" fill="none" stroke="#087f70" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#green)"/><rect x="300" y="259" width="360" height="61" rx="8" fill="#e4f5ef" stroke="#087f70" stroke-width="1.4"/><text x="480.0" y="283.0" font-size="18" text-anchor="middle" fill="#087f70" font-weight="600">Guest vCPU</text><text x="480.0" y="308.0" font-size="15" text-anchor="middle" fill="#20334a" font-weight="400">满足 IF / 优先级等条件后接收中断</text></g></svg>