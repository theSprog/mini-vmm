<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title"><title id="title">PV EOI：KVM 在进入 Guest 前决定是否授权</title><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1763a6"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f70"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a45d12"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b54343"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#66788a"/></marker></defs><rect width="960" height="100%" rx="14" fill="#fbfcfe" stroke="#d6e0e9"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="28" y="38" font-size="24" text-anchor="start" fill="#20334a" font-weight="600">PV EOI：KVM 在进入 Guest 前决定是否授权</text><text x="28" y="65" font-size="15" text-anchor="start" fill="#52667b" font-weight="400">实验环境：xAPIC，未启用 AVIC；示意一个 vCPU 的两个可能路径。</text><text x="242" y="100" font-size="17" text-anchor="middle" fill="#a45d12" font-weight="600">已有 IRR pending / IOAPIC 需要 EOI</text><rect x="25" y="115" width="435" height="59" rx="8" fill="#fff2dc" stroke="#a45d12" stroke-width="1.4"/><text x="242.5" y="138.0" font-size="18" text-anchor="middle" fill="#a45d12" font-weight="600">Host：VMENTRY 前</text><text x="242.5" y="163.0" font-size="15" text-anchor="middle" fill="#20334a" font-weight="400">不授权 PV EOI</text><polyline points="242,174 242,202" fill="none" stroke="#a45d12" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#amber)"/><text x="305" y="194" font-size="14" text-anchor="middle" fill="#a45d12" font-weight="400">VMENTRY</text><rect x="25" y="202" width="435" height="67" rx="8" fill="#fff2dc" stroke="#a45d12" stroke-width="1.4"/><text x="242.5" y="229.0" font-size="18" text-anchor="middle" fill="#a45d12" font-weight="600">Guest：处理完中断</text><text x="242.5" y="254.0" font-size="15" text-anchor="middle" fill="#20334a" font-weight="400">写 LAPIC EOI MMIO</text><polyline points="242,269 242,308" fill="none" stroke="#a45d12" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#amber)"/><text x="347" y="291" font-size="14" text-anchor="middle" fill="#a45d12" font-weight="400">EOI 引发 VMEXIT</text><rect x="25" y="308" width="435" height="66" rx="8" fill="#eff3f7" stroke="#66788a" stroke-width="1.4"/><text x="242.5" y="334.5" font-size="18" text-anchor="middle" fill="#66788a" font-weight="600">Host：同步 LAPIC EOI</text><text x="242.5" y="359.5" font-size="15" text-anchor="middle" fill="#20334a" font-weight="400">必要时通知 IOAPIC / 重新评估 IRR</text><text x="712" y="100" font-size="17" text-anchor="middle" fill="#087f70" font-weight="600">无 pending，且无需通知 IOAPIC</text><rect x="495" y="115" width="435" height="59" rx="8" fill="#e4f5ef" stroke="#087f70" stroke-width="1.4"/><text x="712.5" y="138.0" font-size="18" text-anchor="middle" fill="#087f70" font-weight="600">Host：VMENTRY 前</text><text x="712.5" y="163.0" font-size="15" text-anchor="middle" fill="#20334a" font-weight="400">设置共享内存中的授权位</text><polyline points="712,174 712,202" fill="none" stroke="#087f70" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#green)"/><text x="775" y="194" font-size="14" text-anchor="middle" fill="#087f70" font-weight="400">VMENTRY</text><rect x="495" y="202" width="435" height="67" rx="8" fill="#e4f5ef" stroke="#087f70" stroke-width="1.4"/><text x="712.5" y="229.0" font-size="18" text-anchor="middle" fill="#087f70" font-weight="600">Guest：处理完中断</text><text x="712.5" y="254.0" font-size="15" text-anchor="middle" fill="#20334a" font-weight="400">清共享内存位，跳过 EOI MMIO</text><polyline points="712,269 712,308" fill="none" stroke="#087f70" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#green)" stroke-dasharray="6 5"/><text x="817" y="291" font-size="14" text-anchor="middle" fill="#087f70" font-weight="400">下一次必要的 VMEXIT</text><rect x="495" y="308" width="435" height="66" rx="8" fill="#eff3f7" stroke="#66788a" stroke-width="1.4"/><text x="712.5" y="334.5" font-size="18" text-anchor="middle" fill="#66788a" font-weight="600">Host：同步 LAPIC EOI</text><text x="712.5" y="359.5" font-size="15" text-anchor="middle" fill="#20334a" font-weight="400">清 ISR，重新评估中断</text><text x="480" y="397" font-size="15" text-anchor="middle" fill="#52667b" font-weight="400">快速路径省去的是专门为 EOI 触发的 exit，不是省略 EOI。</text></g></svg>