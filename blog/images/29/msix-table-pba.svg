 x2="916" y2="183" stroke="#66788a" stroke-width="1.4"/><text x="422" y="201" font-size="16" text-anchor="start" fill="#20334a" font-weight="400" font-family="Consolas, DejaVu Sans Mono, monospace">1</text><text x="511" y="201" font-size="15" text-anchor="start" fill="#20334a" font-weight="400" font-family="Consolas, DejaVu Sans Mono, monospace">0xFEE01000</text><text x="681" y="201" font-size="15" text-anchor="start" fill="#20334a" font-weight="400" font-family="Consolas, DejaVu Sans Mono, monospace">0x43</text><text x="836" y="201" font-size="15" text-anchor="start" fill="#a45d12" font-weight="400" font-family="Consolas, DejaVu Sans Mono, monospace">1</text><line x1="420" y1="212" x2="916" y2="212" stroke="#66788a" stroke-width="1.4"/><text x="422" y="230" font-size="16" text-anchor="start" fill="#20334a" font-weight="400" font-family="Consolas, DejaVu Sans Mono, monospace">2</text><text x="511" y="230" font-size="15" text-anchor="start" fill="#20334a" font-weight="400" font-family="Consolas, DejaVu Sans Mono, monospace">0xFEE02000</text><text x="681" y="230" font-size="15" text-anchor="start" fill="#20334a" font-weight="400" font-family="Consolas, DejaVu Sans Mono, monospace">0x40</text><text x="836" y="230" font-size="15" text-anchor="start" fill="#20334a" font-weight="400" font-family="Consolas, DejaVu Sans Mono, monospace">0</text><line x1="420" y1="241" x2="916" y2="241" stroke="#66788a" stroke-width="1.4"/><text x="422" y="259" font-size="16" text-anchor="start" fill="#20334a" font-weight="400" font-family="Consolas, DejaVu Sans Mono, monospace">3</text><text x="511" y="259" font-size="15" text-anchor="start" fill="#20334a" font-weight="400" font-family="Consolas, DejaVu Sans Mono, monospace">0xFEE03000</text><text x="681" y="259" font-size="15" text-anchor="start" fill="#20334a" font-weight="400" font-family="Consolas, DejaVu Sans Mono, monospace">0x57</text><text x="836" y="259" font-size="15" text-anchor="start" fill="#20334a" font-weight="400" font-family="Consolas, DejaVu Sans Mono, monospace">0</text><rect x="406" y="298" width="524" height="68" rx="8" fill="#e4f5ef" stroke="#087f70" stroke-width="1.4"/><text x="420" y="326" font-size="17" text-anchor="start" fill="#087f70" font-weight="600">PBA（只读 pending bits）</text><text x="435" y="350" font-size="15" text-anchor="start" fill="#52667b" font-weight="400" font-family="Consolas, DejaVu Sans Mono, monospace">bit 0 = 0</text><text x="556" y="350" font-size="15" text-anchor="start" fill="#087f70" font-weight="400" font-family="Consolas, DejaVu Sans Mono, monospace">bit 1 = 1</text><text x="677" y="350" font-size="15" text-anchor="start" fill="#52667b" font-weight="400" font-family="Consolas, DejaVu Sans Mono, monospace">bit 2 = 0</text><text x="798" y="350" font-size="15" text-anchor="start" fill="#52667b" font-weight="400" font-family="Consolas, DejaVu Sans Mono, monospace">bit 3 = 0</text><text x="480" y="397" font-size="15" text-anchor="middle" fill="#52667b" font-weight="400">有效屏蔽 = Function Mask OR Vector Mask；解除屏蔽时处理 pending。</text></g></svg>
