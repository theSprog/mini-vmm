<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title"><title id="title">MSI-X：独立消息表与 Pending Bit Array</title><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1763a6"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f70"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a45d12"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b54343"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#66788a"/></marker></defs><rect width="960" height="100%" rx="14" fill="#fbfcfe" stroke="#d6e0e9"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="28" y="38" font-size="24" text-anchor="start" fill="#20334a" font-weight="600">MSI-X：独立消息表与 Pending Bit Array</text><rect x="30" y="92" width="290" height="60" rx="8" fill="#e9f2fb" stroke="#1763a6" stroke-width="1.4"/><text x="175.0" y="115.5" font-size="18" text-anchor="middle" fill="#1763a6" font-weight="600">PCI Configuration Space</text><text x="175.0" y="140.5" font-size="15" text-anchor="middle" fill="#20334a" font-weight="400">MSI-X Capability</text><rect x="30" y="168" width="290" height="58" rx="8" fill="#e9f2fb" stroke="#1763a6" stroke-width="1.4"/><text x="175.0" y="190.5" font-size="18" text-anchor="middle" fill="#1763a6" font-weight="600">Table BIR + Offset</text><text x="175.0" y="215.5" font-size="15" text-anchor="middle" fill="#20334a" font-weight="400"