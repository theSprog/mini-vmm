<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" width="840" height="317" viewBox="0 0 840 317" role="img" aria-labelledby="title desc">
  <title id="title">MP table：先找到入口，再读取配置</title>
  <desc id="desc">操作系统在约定的低地址区域按 16 字节对齐查找 _MP_。mini-vmm 的浮动指针位于 0x9FC00，并存有 PCMP 配置表的物理地址。</desc>
  <style>
    text { font-family: system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
    .ink { fill: #142d48; }
    .muted { fill: #4c6481; }
    .white { fill: #fff; }
    .goldText { fill: #784417; }
    .tealText { fill: #20534a; }
    .surface { fill: #f5f8fc; stroke: #c8d5e5; }
    .panel { fill: #fff; stroke: #a5b8cc; }
    .navy { fill: #183a5a; }
    .blue { fill: #dbeafe; stroke: #85a9d5; }
    .flag { fill: #fff2df; stroke: #c2a174; }
    .res { fill: #e9eff6; stroke: #a5b8cc; }
    .teal { fill: #d9eee9; stroke: #78aca5; }
    .purple { fill: #f0ebff; stroke: #a397d1; }
    .line, .faint, .accent, .tealWire, .dash { fill: none; }
    .line { stroke: #58728d; stroke-width: 1.5; }
    .faint { stroke: #bdcbd9; }
    .accent { stroke: #925520; stroke-width: 2; }
    .tealWire { stroke: #326e64; stroke-width: 2; }
    .dash { stroke: #7589a0; stroke-width: 1.4; stroke-dasharray: 4 4; }
    .pad { fill: #f5f8fc; stroke: #58728d; }
    .tap { fill: #925520; stroke: #fff2df; }
    .tapTeal { fill: #326e64; stroke: #e5f5f2; }
  </style>
  <rect x="1" y="1" width="838" height="315" rx="19" class="surface"/>
  <text x="36" y="44" font-size="23" font-weight="700" text-anchor="start" class="ink">MP table：先找到入口，再读取配置</text>
  <text x="36" y="80" font-size="14" font-weight="700" text-anchor="start" class="muted">MPS 1.4 约定的扫描位置</text>
  <text x="279" y="80" font-size="14" font-weight="700" text-anchor="start" class="muted">找到的入口</text>
  <text x="551" y="80" font-size="14" font-weight="700" text-anchor="start" class="muted">指针指向的配置</text>
  <rect x="36" y="102" width="200" height="53" rx="9" class="teal"/>
  <text x="51" y="127" font-size="18" font-weight="700" text-anchor="start" class="ink">EBDA 前 1 KiB</text>
  <rect x="36" y="168" width="200" height="53" rx="9" class="panel"/>
  <text x="51" y="193" font-size="18" font-weight="700" text-anchor="start" class="ink">常规内存末尾 1 KiB</text>
  <rect x="36" y="234" width="200" height="53" rx="9" class="panel"/>
  <text x="51" y="259" font-size="18" font-weight="700" text-anchor="start" class="ink">BIOS ROM 区</text>
  <text x="51" y="281" font-size="14" font-weight="400" text-anchor="start" class="muted">0xF0000–0xFFFFF</text>
  <rect x="279" y="102" width="198" height="119" rx="9" class="teal"/>
  <text x="294" y="127" font-size="18" font-weight="700" text-anchor="start" class="ink">_MP_ · 浮动指针</text>
  <text x="294" y="149" font-size="14" font-weight="400" text-anchor="start" class="muted">16 字节，16 字节对齐</text>
  <text x="294" y="168" font-size="14" font-weight="400" text-anchor="start" class="muted">mini-vmm：0x9FC00</text>
  <text x="294" y="187" font-size="14" font-weight="400" text-anchor="start" class="muted">包含配置表物理地址</text>
  <rect x="551" y="102" width="253" height="185" rx="9" class="blue"/>
  <text x="566" y="127" font-size="18" font-weight="700" text-anchor="start" class="ink">PCMP · 配置表</text>
  <text x="566" y="149" font-size="14" font-weight="400" text-anchor="start" class="muted">表头：签名、长度、校验和等</text>
  <text x="566" y="168" font-size="14" font-weight="400" text-anchor="start" class="muted">条目：处理器 / 总线 / IOAPIC</text>
  <text x="566" y="187" font-size="14" font-weight="400" text-anchor="start" class="muted">I/O 中断分配</text>
  <text x="566" y="206" font-size="14" font-weight="400" text-anchor="start" class="muted">本地中断分配</text>
  <path d="M 236 130 H 279" class="tealWire"/>
  <path d="M -8 -4 L 0 0 L -8 4" class="tealWire" transform="translate(279 130) rotate(0)"/>
  <path d="M 477 130 H 551" class="line"/>
  <path d="M -8 -4 L 0 0 L -8 4" class="line" transform="translate(551 130) rotate(0)"/>
  <text x="514" y="119" font-size="13" font-weight="400" text-anchor="middle" class="muted">物理地址</text>
  <text x="279" y="253" font-size="14" font-weight="400" text-anchor="start" class="muted">入口和配置表分别校验。</text>
</svg>
