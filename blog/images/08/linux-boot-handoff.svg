<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" width="840" height="389" viewBox="0 0 840 389" role="img" aria-labelledby="title desc">
  <title id="title">进入 startup_64：交接内存数据和 CPU 状态</title>
  <desc id="desc">直接启动时，VMM 在 guest 内存构造 boot_params。VMM 把 CPU 置于 64 位模式、开启分页、关闭中断、设置段选择子，并用 RSI 传入 boot_params 的地址，随后进入 Linux 的 64 位入口。</desc>
  <style>
    text { font-family: system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
    .ink { fill: #142d48; }
    .muted { fill: #4c6481; }
    .white { fill: #fff; }
    .goldText { fill: #784417; }
    .tealText { fill: #20534a; }
    .surface { fill: #f5f8fc; stroke: #c8d5e5; }
    .panel { fill: #fff; stroke: #a5b8cc; }
    .navy { fill: #183a5a; }
    .blue { fill: #dbeafe; stroke: #85a9d5; }
    .flag { fill: #fff2df; stroke: #c2a174; }
    .res { fill: #e9eff6; stroke: #a5b8cc; }
    .teal { fill: #d9eee9; stroke: #78aca5; }
    .purple { fill: #f0ebff; stroke: #a397d1; }
    .line, .faint, .accent, .tealWire, .dash { fill: none; }
    .line { stroke: #58728d; stroke-width: 1.5; }
    .faint { stroke: #bdcbd9; }
    .accent { stroke: #925520; stroke-width: 2; }
    .tealWire { stroke: #326e64; stroke-width: 2; }
    .dash { stroke: #7589a0; stroke-width: 1.4; stroke-dasharray: 4 4; }
    .pad { fill: #f5f8fc; stroke: #58728d; }
    .tap { fill: #925520; stroke: #fff2df; }
    .tapTeal { fill: #326e64; stroke: #e5f5f2; }
  </style>
  <rect x="1" y="1" width="838" height="387" rx="19" class="surface"/>
  <text x="36" y="44" font-size="23" font-weight="700" text-anchor="start" class="ink">进入 startup_64：交接内存数据和 CPU 状态</text>
  <rect x="36" y="83" width="329" height="134" rx="9" class="teal"/>
  <text x="51" y="108" font-size="18" font-weight="700" text-anchor="start" class="ink">CPU 入口状态</text>
  <text x="51" y="130" font-size="14" font-weight="400" text-anchor="start" class="muted">64 位模式；分页开；中断关</text>
  <text x="51" y="149" font-size="14" font-weight="400" text-anchor="start" class="muted">CS = 0x10；DS / ES / SS = 0x18</text>
  <text x="51" y="168" font-size="14" font-weight="400" text-anchor="start" class="muted">RSI = 0x7000（mini-vmm）</text>
  <rect x="507" y="83" width="297" height="70" rx="9" class="panel"/>
  <text x="522" y="108" font-size="18" font-weight="700" text-anchor="start" class="ink">Linux：startup_64</text>
  <text x="522" y="130" font-size="14" font-weight="400" text-anchor="start" class="muted">进入 64 位入口</text>
  <path d="M 365 118 H 507" class="line"/>
  <path d="M -8 -4 L 0 0 L -8 4" class="line" transform="translate(507 118) rotate(0)"/>
  <text x="436" y="107" font-size="13" font-weight="700" text-anchor="middle" class="muted">控制权</text>
  <rect x="507" y="170" width="297" height="148" rx="9" class="blue"/>
  <text x="522" y="197" font-size="17" font-weight="700" text-anchor="start" class="ink">boot_params · GPA 0x7000</text>
  <path d="M 507 208 H 804 M 507 236 H 804 M 507 262 H 804 M 507 288 H 804" class="faint"/>
  <text x="522" y="228" font-size="14" font-weight="400" text-anchor="start" class="ink">setup header：命令行、initrd 等位置</text>
  <text x="522" y="254" font-size="14" font-weight="400" text-anchor="start" class="ink">E820 表：哪些物理范围可用</text>
  <text x="522" y="280" font-size="14" font-weight="400" text-anchor="start" class="ink">acpi_rsdp_addr：ACPI 根指针</text>
  <text x="522" y="306" font-size="14" font-weight="400" text-anchor="start" class="ink">其他启动参数（结构共 4 KiB）</text>
  <path d="M 365 172 H 416 V 195 H 507" class="tealWire"/>
  <path d="M -8 -4 L 0 0 L -8 4" class="tealWire" transform="translate(507 195) rotate(0)"/>
  <text x="422" y="185" font-size="13" font-weight="700" text-anchor="start" class="tealText">RSI 指向</text>
  <rect x="36" y="252" width="329" height="66" rx="9" class="panel"/>
  <text x="51" y="278" font-size="16" font-weight="700" text-anchor="start" class="ink">mini-vmm 的恒等映射</text>
  <text x="51" y="299" font-size="14" font-weight="400" text-anchor="start" class="ink">覆盖内核、启动参数、命令行和 initrd。</text>
  <text x="36" y="356" font-size="14" font-weight="400" text-anchor="start" class="muted">“zero page”是历史名称；启动协议靠 RSI 传地址，并不要求它放在物理地址 0。</text>
</svg>
