<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" width="840" height="395" viewBox="0 0 840 395" role="img" aria-labelledby="title desc">
  <title id="title">DSDT 关机：FADT 给端口，AML 给睡眠类型</title>
  <desc id="desc">FADT 把 PM1a 控制寄存器定位到 I/O 端口 0x604。DSDT 中 _S5_ 包的第一个元素给出睡眠类型 5。Linux 将 5 填入 12 至 10 位并置位第 13 位，向端口写入关机请求。</desc>
  <style>
    text { font-family: system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
    .ink { fill: #142d48; }
    .muted { fill: #4c6481; }
    .white { fill: #fff; }
    .goldText { fill: #784417; }
    .tealText { fill: #20534a; }
    .surface { fill: #f5f8fc; stroke: #c8d5e5; }
    .panel { fill: #fff; stroke: #a5b8cc; }
    .navy { fill: #183a5a; }
    .blue { fill: #dbeafe; stroke: #85a9d5; }
    .flag { fill: #fff2df; stroke: #c2a174; }
    .res { fill: #e9eff6; stroke: #a5b8cc; }
    .teal { fill: #d9eee9; stroke: #78aca5; }
    .purple { fill: #f0ebff; stroke: #a397d1; }
    .line, .faint, .accent, .tealWire, .dash { fill: none; }
    .line { stroke: #58728d; stroke-width: 1.5; }
    .faint { stroke: #bdcbd9; }
    .accent { stroke: #925520; stroke-width: 2; }
    .tealWire { stroke: #326e64; stroke-width: 2; }
    .dash { stroke: #7589a0; stroke-width: 1.4; stroke-dasharray: 4 4; }
    .pad { fill: #f5f8fc; stroke: #58728d; }
    .tap { fill: #925520; stroke: #fff2df; }
    .tapTeal { fill: #326e64; stroke: #e5f5f2; }
  </style>
  <rect x="1" y="1" width="838" height="393" rx="19" class="surface"/>
  <text x="36" y="44" font-size="23" font-weight="700" text-anchor="start" class="ink">DSDT 关机：FADT 给端口，AML 给睡眠类型</text>
  <rect x="36" y="83" width="305" height="78" rx="9" class="blue"/>
  <text x="51" y="108" font-size="18" font-weight="700" text-anchor="start" class="ink">FADT：写到哪里？</text>
  <text x="51" y="130" font-size="14" font-weight="400" text-anchor="start" class="muted">PM1a_CNT_BLK = I/O 端口 0x604</text>
  <rect x="36" y="191" width="305" height="90" rx="9" class="purple"/>
  <text x="51" y="216" font-size="18" font-weight="700" text-anchor="start" class="ink">DSDT：写入什么睡眠类型？</text>
  <text x="51" y="238" font-size="14" font-weight="400" text-anchor="start" class="muted">AML 对象 _S5_ → { 5, 5, 0, 0 }</text>
  <text x="51" y="257" font-size="14" font-weight="400" text-anchor="start" class="muted">第一个元素 → PM1a 的 SLP_TYP = 5</text>
  <rect x="453" y="83" width="351" height="78" rx="9" class="panel"/>
  <text x="468" y="108" font-size="18" font-weight="700" text-anchor="start" class="ink">Linux / ACPICA</text>
  <text x="468" y="130" font-size="14" font-weight="400" text-anchor="start" class="muted">取出 SLP_TYP，并置位 SLP_EN 发出请求</text>
  <path d="M 341 122 H 453" class="line"/>
  <path d="M -8 -4 L 0 0 L -8 4" class="line" transform="translate(453 122) rotate(0)"/>
  <path d="M 341 229 H 398 V 149 H 453" class="line"/>
  <path d="M -8 -4 L 0 0 L -8 4" class="line" transform="translate(453 149) rotate(0)"/>
  <path d="M 628 161 V 220" class="tealWire"/>
  <path d="M -8 -4 L 0 0 L -8 4" class="tealWire" transform="translate(628 220) rotate(90)"/>
  <text x="642" y="197" font-size="13" font-weight="700" text-anchor="start" class="tealText">向 0x604 写入关机请求</text>
  <rect x="453" y="221" width="351" height="116" rx="9" class="teal"/>
  <text x="468" y="247" font-size="18" font-weight="700" text-anchor="start" class="ink">VMM 模拟的 PM1a_CNT</text>
  <text x="468" y="269" font-size="13" font-weight="400" text-anchor="start" class="muted">这次写入的关键位</text>
  <rect x="468" y="282" width="110" height="33" rx="0" class="flag"/>
  <text x="523" y="303" font-size="14" font-weight="700" text-anchor="middle" class="ink">bit 13 = 1</text>
  <rect x="578" y="282" width="210" height="33" rx="0" class="blue"/>
  <text x="683" y="303" font-size="14" font-weight="700" text-anchor="middle" class="ink">bits 12:10 = 101₂</text>
  <text x="523" y="330" font-size="12" font-weight="700" text-anchor="middle" class="muted">SLP_EN</text>
  <text x="683" y="330" font-size="12" font-weight="700" text-anchor="middle" class="muted">SLP_TYP</text>
  <text x="36" y="369" font-size="14" font-weight="400" text-anchor="start" class="muted">0x604 是 I/O 端口地址；图中只展开写入数据里用于请求关机的两段位域。</text>
</svg>
