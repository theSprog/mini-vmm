<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" width="840" height="335" viewBox="0 0 840 335" role="img" aria-labelledby="title desc">
  <title id="title">EVENTINJ · VMCB 事件注入位域</title>
  <desc id="desc">VMCB 控制区偏移 0xA8，64 位。63 至 32 位是错误码，31 是 V，30 至 12 保留，11 是 EV，10 至 8 是类型，7 至 0 是向量。类型 0 外部中断，2 NMI，3 异常，4 软件中断。</desc>
  <style>
    text { font-family: system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
    .ink { fill: #142d48; }
    .muted { fill: #4c6481; }
    .white { fill: #fff; }
    .goldText { fill: #784417; }
    .tealText { fill: #20534a; }
    .surface { fill: #f5f8fc; stroke: #c8d5e5; }
    .panel { fill: #fff; stroke: #a5b8cc; }
    .navy { fill: #183a5a; }
    .blue { fill: #dbeafe; stroke: #85a9d5; }
    .flag { fill: #fff2df; stroke: #c2a174; }
    .res { fill: #e9eff6; stroke: #a5b8cc; }
    .teal { fill: #d9eee9; stroke: #78aca5; }
    .purple { fill: #f0ebff; stroke: #a397d1; }
    .line, .faint, .accent, .tealWire, .dash { fill: none; }
    .line { stroke: #58728d; stroke-width: 1.5; }
    .faint { stroke: #bdcbd9; }
    .accent { stroke: #925520; stroke-width: 2; }
    .tealWire { stroke: #326e64; stroke-width: 2; }
    .dash { stroke: #7589a0; stroke-width: 1.4; stroke-dasharray: 4 4; }
    .pad { fill: #f5f8fc; stroke: #58728d; }
    .tap { fill: #925520; stroke: #fff2df; }
    .tapTeal { fill: #326e64; stroke: #e5f5f2; }
  </style>
  <rect x="1" y="1" width="838" height="333" rx="19" class="surface"/>
  <text x="36" y="44" font-size="23" font-weight="700" text-anchor="start" class="ink">EVENTINJ · VMCB 事件注入位域</text>
  <text x="36" y="72" font-size="15" font-weight="400" text-anchor="start" class="ink">VMCB 控制区 +0xA8 · 高、低两行各 32 位；字段按位宽绘制</text>
  <text x="36" y="110" font-size="16" font-weight="700" text-anchor="start" class="ink">高 32 位</text>
  <text x="48" y="131" font-size="12" font-weight="700" text-anchor="middle" class="muted">63</text>
  <text x="792" y="131" font-size="12" font-weight="700" text-anchor="middle" class="muted">32</text>
  <rect x="36" y="139" width="768" height="32" rx="0" class="blue" data-bits="63:32"/>
  <text x="420" y="160" font-size="15" font-weight="700" text-anchor="middle" class="ink">错误码（EV = 1 时有效）</text>
  <text x="36" y="206" font-size="16" font-weight="700" text-anchor="start" class="ink">低 32 位</text>
  <text x="48" y="226" font-size="11" font-weight="700" text-anchor="middle" class="muted">31</text>
  <text x="72" y="226" font-size="11" font-weight="700" text-anchor="middle" class="muted">30</text>
  <text x="96" y="226" font-size="11" font-weight="700" text-anchor="middle" class="muted">29</text>
  <text x="120" y="226" font-size="11" font-weight="700" text-anchor="middle" class="muted">28</text>
  <text x="144" y="226" font-size="11" font-weight="700" text-anchor="middle" class="muted">27</text>
  <text x="168" y="226" font-size="11" font-weight="700" text-anchor="middle" class="muted">26</text>
  <text x="192" y="226" font-size="11" font-weight="700" text-anchor="middle" class="muted">25</text>
  <text x="216" y="226" font-size="11" font-weight="700" text-anchor="middle" class="muted">24</text>
  <text x="240" y="226" font-size="11" font-weight="700" text-anchor="middle" class="muted">23</text>
  <text x="264" y="226" font-size="11" font-weight="700" text-anchor="middle" class="muted">22</text>
  <text x="288" y="226" font-size="11" font-weight="700" text-anchor="middle" class="muted">21</text>
  <text x="312" y="226" font-size="11" font-weight="700" text-anchor="middle" class="muted">20</text>
  <text x="336" y="226" font-size="11" font-weight="700" text-anchor="middle" class="muted">19</text>
  <text x="360" y="226" font-size="11" font-weight="700" text-anchor="middle" class="muted">18</text>
  <text x="384" y="226" font-size="11" font-weight="700" text-anchor="middle" class="muted">17</text>
  <text x="408" y="226" font-size="11" font-weight="700" text-anchor="middle" class="muted">16</text>
  <text x="432" y="226" font-size="11" font-weight="700" text-anchor="middle" class="muted">15</text>
  <text x="456" y="226" font-size="11" font-weight="700" text-anchor="middle" class="muted">14</text>
  <text x="480" y="226" font-size="11" font-weight="700" text-anchor="middle" class="muted">13</text>
  <text x="504" y="226" font-size="11" font-weight="700" text-anchor="middle" class="muted">12</text>
  <text x="528" y="226" font-size="11" font-weight="700" text-anchor="middle" class="muted">11</text>
  <text x="552" y="226" font-size="11" font-weight="700" text-anchor="middle" class="muted">10</text>
  <text x="576" y="226" font-size="11" font-weight="700" text-anchor="middle" class="muted">9</text>
  <text x="600" y="226" font-size="11" font-weight="700" text-anchor="middle" class="muted">8</text>
  <text x="624" y="226" font-size="11" font-weight="700" text-anchor="middle" class="muted">7</text>
  <text x="648" y="226" font-size="11" font-weight="700" text-anchor="middle" class="muted">6</text>
  <text x="672" y="226" font-size="11" font-weight="700" text-anchor="middle" class="muted">5</text>
  <text x="696" y="226" font-size="11" font-weight="700" text-anchor="middle" class="muted">4</text>
  <text x="720" y="226" font-size="11" font-weight="700" text-anchor="middle" class="muted">3</text>
  <text x="744" y="226" font-size="11" font-weight="700" text-anchor="middle" class="muted">2</text>
  <text x="768" y="226" font-size="11" font-weight="700" text-anchor="middle" class="muted">1</text>
  <text x="792" y="226" font-size="11" font-weight="700" text-anchor="middle" class="muted">0</text>
  <rect x="36" y="233" width="24" height="32" rx="0" class="flag" data-bits="31"/>
  <text x="48" y="254" font-size="11" font-weight="700" text-anchor="middle" class="ink">V</text>
  <rect x="60" y="233" width="456" height="32" rx="0" class="res" data-bits="30:12"/>
  <text x="288" y="254" font-size="14" font-weight="400" text-anchor="middle" class="muted">保留</text>
  <rect x="516" y="233" width="24" height="32" rx="0" class="flag" data-bits="11"/>
  <text x="528" y="254" font-size="11" font-weight="700" text-anchor="middle" class="ink">EV</text>
  <rect x="540" y="233" width="72" height="32" rx="0" class="teal" data-bits="10:8"/>
  <text x="576" y="254" font-size="14" font-weight="700" text-anchor="middle" class="ink">类型</text>
  <rect x="612" y="233" width="192" height="32" rx="0" class="blue" data-bits="7:0"/>
  <text x="708" y="254" font-size="14" font-weight="700" text-anchor="middle" class="ink">向量</text>
  <text x="36" y="290" font-size="14" font-weight="700" text-anchor="start" class="ink">V = 1：有待注入事件　·　EV = 1：投递时压入错误码（适用的异常）</text>
  <text x="36" y="314" font-size="14" font-weight="400" text-anchor="start" class="ink">类型：000 外部中断 INTR　·　010 NMI　·　011 异常　·　100 软件中断 INTn</text>
</svg>
