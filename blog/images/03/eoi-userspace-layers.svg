<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" width="840" height="403" viewBox="0 0 840 403" role="img" aria-labelledby="title desc">
  <title id="title">方案一 · EOI 由用户态 VMM 处理</title>
  <desc id="desc">编号为时间顺序。Guest 写 EOI，引发 VMEXIT。KVM 解码 MMIO 并让 KVM_RUN 返回 KVM_EXIT_MMIO。用户态 VMM 更新虚拟 LAPIC，必要时另行请求注入，随后再次调用 KVM_RUN。KVM 执行 VMRUN，Guest 继续。执行路径跨两次 Host 内核与用户态边界。</desc>
  <style>
    text { font-family: system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
    .ink { fill: #142d48; }
    .muted { fill: #4c6481; }
    .white { fill: #fff; }
    .goldText { fill: #784417; }
    .tealText { fill: #20534a; }
    .surface { fill: #f5f8fc; stroke: #c8d5e5; }
    .panel { fill: #fff; stroke: #a5b8cc; }
    .navy { fill: #183a5a; }
    .blue { fill: #dbeafe; stroke: #85a9d5; }
    .flag { fill: #fff2df; stroke: #c2a174; }
    .res { fill: #e9eff6; stroke: #a5b8cc; }
    .teal { fill: #d9eee9; stroke: #78aca5; }
    .purple { fill: #f0ebff; stroke: #a397d1; }
    .line, .faint, .accent, .tealWire, .dash { fill: none; }
    .line { stroke: #58728d; stroke-width: 1.5; }
    .faint { stroke: #bdcbd9; }
    .accent { stroke: #925520; stroke-width: 2; }
    .tealWire { stroke: #326e64; stroke-width: 2; }
    .dash { stroke: #7589a0; stroke-width: 1.4; stroke-dasharray: 4 4; }
    .pad { fill: #f5f8fc; stroke: #58728d; }
    .tap { fill: #925520; stroke: #fff2df; }
    .tapTeal { fill: #326e64; stroke: #e5f5f2; }
  </style>
  <rect x="1" y="1" width="838" height="401" rx="19" class="surface"/>
  <text x="36" y="44" font-size="23" font-weight="700" text-anchor="start" class="ink">方案一 · EOI 由用户态 VMM 处理</text>
  <text x="36" y="70" font-size="15" font-weight="400" text-anchor="start" class="ink">沿时间从左向右读 ①–④；线在哪一层，就在哪一层执行。</text>
  <rect x="36" y="94" width="768" height="74" rx="9" class="blue"/>
  <rect x="36" y="177" width="768" height="166" rx="9" class="panel"/>
  <rect x="47" y="194" width="746" height="65" rx="7" class="teal"/>
  <rect x="47" y="263" width="746" height="65" rx="7" class="purple"/>
  <path d="M172 94V167 M172 194V259 M172 263V327" class="faint"/>
  <text x="64" y="126" font-size="17" font-weight="700" text-anchor="start" class="ink">Guest</text>
  <text x="64" y="147" font-size="13" font-weight="400" text-anchor="start" class="muted">vCPU 执行</text>
  <text x="63" y="189" font-size="11" font-weight="700" text-anchor="start" class="muted">Host</text>
  <text x="64" y="223" font-size="17" font-weight="700" text-anchor="start" class="ink">KVM</text>
  <text x="64" y="244" font-size="13" font-weight="400" text-anchor="start" class="muted">Host 内核态</text>
  <text x="64" y="291" font-size="17" font-weight="700" text-anchor="start" class="ink">VMM</text>
  <text x="64" y="312" font-size="13" font-weight="400" text-anchor="start" class="muted">Host 用户态</text>
  <path d="M179 261H788" class="dash"/>
  <path d="M197 140H241L298 234H367L419 304H568L622 234H663L719 140H778" class="accent"/>
  <text x="260" y="155" font-size="13" font-weight="700" text-anchor="start" class="goldText">#VMEXIT</text>
  <text x="645" y="162" font-size="13" font-weight="700" text-anchor="start" class="goldText">VMRUN</text>
  <circle cx="216" cy="140" r="10" class="tap"/>
  <text x="216" y="144" font-size="13" font-weight="700" text-anchor="middle" class="white">1</text>
  <circle cx="323" cy="234" r="10" class="tap"/>
  <text x="323" y="238" font-size="13" font-weight="700" text-anchor="middle" class="white">2</text>
  <circle cx="476" cy="304" r="10" class="tap"/>
  <text x="476" y="308" font-size="13" font-weight="700" text-anchor="middle" class="white">3</text>
  <circle cx="743" cy="140" r="10" class="tap"/>
  <text x="743" y="144" font-size="13" font-weight="700" text-anchor="middle" class="white">4</text>
  <text x="225" y="121" font-size="14" font-weight="700" text-anchor="middle" class="ink">写 LAPIC EOI</text>
  <text x="335" y="218" font-size="14" font-weight="700" text-anchor="middle" class="ink">解码 MMIO</text>
  <text x="475" y="289" font-size="14" font-weight="700" text-anchor="middle" class="ink">更新虚拟 LAPIC</text>
  <text x="747" y="121" font-size="14" font-weight="700" text-anchor="middle" class="ink">Guest 继续</text>
  <text x="405" y="241" font-size="12" font-weight="700" text-anchor="start" class="muted">KVM_EXIT_MMIO</text>
  <text x="615" y="291" font-size="13" font-weight="700" text-anchor="start" class="muted">再调 KVM_RUN</text>
  <text x="490" y="323" font-size="12" font-weight="400" text-anchor="start" class="muted">若有需要，另行请求注入</text>
  <text x="36" y="375" font-size="14" font-weight="700" text-anchor="start" class="ink">Host 用户态／内核态边界：跨两次；原来的 KVM_RUN 返回，VMM 再次调用。</text>
</svg>
