<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" width="840" height="305" viewBox="0 0 840 305" role="img" aria-labelledby="title desc">
  <title id="title">RTE[4] · IOAPIC pin 4 的 64 位表项</title>
  <desc id="desc">以 KVM 模拟的 IOAPIC 为例，输入引脚 4 对应 RTE[4]。位 63 到 56 是目的字段，位 7 到 0 是向量。假设配置为普通 Fixed 投递，向量为 0x41；CPU 用它查 IDT[0x41]，不是用引脚号 4。</desc>
  <rect x="1" y="1" width="838" height="303" rx="19" fill="#f5f8fc" stroke="#c8d5e5"/>
  <g font-family="system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#142d48">
    <text x="36" y="41" font-size="23" font-weight="700">RTE[4] · IOAPIC pin 4 对应的表项</text>
    <text x="36" y="66" font-size="14">64 位，分成高、低两个 32 位字；高亮的是目的字段和向量。</text>
    <g font-size="15" font-weight="700">
      <text x="36" y="104">高 32 位</text>
      <text x="36" y="183">低 32 位</text>
    </g>
    <g stroke="#8da3bc">
      <rect x="36" y="114" width="192" height="34" fill="#e5f5f2" data-bits="63:56"/>
      <rect x="228" y="114" width="576" height="34" fill="#e9eff6" data-bits="55:32"/>
      <rect x="36" y="193" width="360" height="34" fill="#e9eff6" data-bits="31:17"/>
      <rect x="396" y="193" width="216" height="34" fill="#f0f3f7" data-bits="16:8"/>
      <rect x="612" y="193" width="192" height="34" fill="#e7f2ff" data-bits="7:0"/>
    </g>
    <g text-anchor="middle" font-size="14">
      <text x="132" y="136" font-weight="700" fill="#20534a">目的字段</text>
      <text x="516" y="136" fill="#4c6481">保留</text>
      <text x="216" y="215" fill="#4c6481">保留</text>
      <text x="504" y="215" fill="#4c6481">控制字段（合并显示）</text>
      <text x="708" y="215" font-weight="700">Vector = 0x41</text>
    </g>
    <g text-anchor="middle" font-size="12" fill="#4c6481">
      <text x="132" y="164">63:56</text><text x="516" y="164">55:32</text>
      <text x="216" y="243">31:17</text><text x="504" y="243">16:8</text><text x="708" y="243">7:0</text>
    </g>
    <path d="M612 251V257H804V251 M708 257V267" fill="none" stroke="#58728d" stroke-width="1.5"/>
    <text x="708" y="285" text-anchor="middle" font-size="14" font-weight="700">CPU 查 IDT[0x41]</text>
    <text x="36" y="285" font-size="14">示例假设使用 Fixed 投递：4 选表项，0x41 选 IDT 项。</text>
  </g>
</svg>
