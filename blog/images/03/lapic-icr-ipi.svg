<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" width="840" height="370" viewBox="0 0 840 370" role="img" aria-labelledby="title desc">
  <title id="title">ICR · Interrupt Command Register</title>
  <desc id="desc">xAPIC ICR 的高字在 0x310，低字在 0x300。高字 bit 31 至 24 是目的字段。低字 bit 19 至 18 为目的简写，bit 15 为触发方式，14 为电平，12 为投递状态，11 为目的模式，10 至 8 为投递模式，7 至 0 为向量；SIPI 时使用这八位作为启动页号。</desc>
  <style>
    text { font-family: system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
    .ink { fill: #142d48; }
    .muted { fill: #4c6481; }
    .white { fill: #fff; }
    .goldText { fill: #784417; }
    .tealText { fill: #20534a; }
    .surface { fill: #f5f8fc; stroke: #c8d5e5; }
    .panel { fill: #fff; stroke: #a5b8cc; }
    .navy { fill: #183a5a; }
    .blue { fill: #dbeafe; stroke: #85a9d5; }
    .flag { fill: #fff2df; stroke: #c2a174; }
    .res { fill: #e9eff6; stroke: #a5b8cc; }
    .teal { fill: #d9eee9; stroke: #78aca5; }
    .purple { fill: #f0ebff; stroke: #a397d1; }
    .line, .faint, .accent, .tealWire, .dash { fill: none; }
    .line { stroke: #58728d; stroke-width: 1.5; }
    .faint { stroke: #bdcbd9; }
    .accent { stroke: #925520; stroke-width: 2; }
    .tealWire { stroke: #326e64; stroke-width: 2; }
    .dash { stroke: #7589a0; stroke-width: 1.4; stroke-dasharray: 4 4; }
    .pad { fill: #f5f8fc; stroke: #58728d; }
    .tap { fill: #925520; stroke: #fff2df; }
    .tapTeal { fill: #326e64; stroke: #e5f5f2; }
  </style>
  <rect x="1" y="1" width="838" height="368" rx="19" class="surface"/>
  <text x="36" y="44" font-size="23" font-weight="700" text-anchor="start" class="ink">ICR · Interrupt Command Register</text>
  <text x="36" y="72" font-size="15" font-weight="400" text-anchor="start" class="ink">xAPIC · 64 位命令由高、低两个 32 位 MMIO 寄存器组成</text>
  <text x="36" y="108" font-size="16" font-weight="700" text-anchor="start" class="ink">0x310 · 高字</text>
