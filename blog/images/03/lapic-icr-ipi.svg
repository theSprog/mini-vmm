  <path d="M36 309H804" class="faint"/>
  <text x="36" y="335" font-size="14" font-weight="700" text-anchor="start" class="ink">投递模式示例：000 Fixed　 101 INIT　 110 SIPI（Vector 字段存启动页号）</text>
  <text x="804" y="352" font-size="12" font-weight="400" text-anchor="end" class="muted">灰格 = 保留位</text>
