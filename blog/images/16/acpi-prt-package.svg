<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" width="840" height="413" viewBox="0 0 840 413" role="img" aria-labelledby="title desc">
  <title id="title">ACPI _PRT · 一条 PCI 中断路由</title>
  <desc id="desc">_PRT 返回一个外层 Package，每条路由是一个内层 Package，四个独立元素按顺序为 Address（DWORD）、Pin（Byte）、Source（NamePath 或零值 Byte）、Source Index（DWORD）。Address 内部的 31:16 位是设备号，15:0 位必须为 0xFFFF，匹配所有 function。Pin 从 0 到 3 对应 INTA 到 INTD。Source 为 0 时，Source Index 是 GSI；Source 为 Link Device 的 NamePath 时，Source Index 是该设备的资源描述符索引。</desc>
  <style>
    text { font-family: system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
    .ink { fill: #142d48; }
    .muted { fill: #4c6481; }
    .surface { fill: #f5f8fc; stroke: #c8d5e5; }
    .blue { fill: #dbeafe; stroke: #85a9d5; }
    .teal { fill: #d9eee9; stroke: #78aca5; }
    .panel { fill: #fff; stroke: #a5b8cc; }
  </style>
  <rect x="1" y="1" width="838" height="411" rx="19" class="surface"/>
  <text x="36" y="44" font-size="23" font-weight="700" class="ink">ACPI _PRT · 一条 PCI 中断路由</text>
  <text x="36" y="72" font-size="14" class="muted">外层 Package 是整张表；每个内层 Package 描述一根 PCI 中断引脚的去向。</text>

  <text x="36" y="106" font-size="14" font-weight="700" class="ink">内层 Package · 四个独立元素，框宽不代表位宽</text>
  <rect x="36" y="119" width="180" height="80" rx="8" class="blue"/>
  <rect x="232" y="119" width="176" height="80" rx="8" class="blue"/>
  <rect x="424" y="119" width="180" height="80" rx="8" class="teal"/>
  <rect x="620" y="119" width="184" height="80" rx="8" class="teal"/>
  <g text-anchor="middle" class="ink">
    <g font-size="17" font-weight="700">
      <text x="126" y="144">Address</text>
      <text x="320" y="144">Pin</text>
      <text x="514" y="144">Source</text>
      <text x="712" y="144">Source Index</text>
    </g>
    <g font-size="14">
      <text x="126" y="165">DWORD · 32 位</text>
      <text x="320" y="165">Byte · 8 位</text>
      <text x="514" y="165">NamePath 或 Byte</text>
      <text x="712" y="165">DWORD · 32 位</text>
    </g>
    <g font-size="13" class="muted">
      <text x="126" y="185">指定设备，位域见下方</text>
      <text x="320" y="185">0–3：INTA–INTD</text>
      <text x="514" y="185">Link Device 路径或 0</text>
      <text x="712" y="185">含义由 Source 决定</text>
    </g>
  </g>

  <text x="36" y="232" font-size="14" font-weight="700" class="ink">Address · 32 位内部布局</text>
  <g text-anchor="middle">
    <text x="228" y="255" font-size="13" font-weight="700" class="muted">31:16</text>
    <text x="612" y="255" font-size="13" font-weight="700" class="muted">15:0</text>
    <rect x="36" y="263" width="384" height="38" data-bits="31:16" class="blue"/>
    <rect x="420" y="263" width="384" height="38" data-bits="15:0" class="blue"/>
    <text x="228" y="287" font-size="14" class="ink">设备号</text>
    <text x="612" y="287" font-size="14" class="ink">固定为 0xFFFF（匹配所有 function）</text>
  </g>

  <rect x="36" y="322" width="374" height="66" rx="8" class="panel"/>
  <text x="51" y="348" font-size="15" font-weight="700" class="ink">直接接线 · Source = 0</text>
  <text x="51" y="370" font-size="14" class="muted">Source Index 是目标 GSI。</text>
  <rect x="430" y="322" width="374" height="66" rx="8" class="panel"/>
  <text x="445" y="348" font-size="15" font-weight="700" class="ink">可编程路由 · Source 指向 Link Device</text>
  <text x="445" y="370" font-size="14" class="muted">Source Index 是该设备的资源描述符索引。</text>
</svg>
