<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" width="840" height="366" viewBox="0 0 840 366" role="img" aria-labelledby="title desc">
  <title id="title">INTx swizzle · 把各插槽的 INTA# 错开</title>
  <desc id="desc">一种主板接线示例。Slot 0、1、2、3 的 INTA# 分别接到 IOAPIC 的 Pin 16、17、18、19。这四个引脚在本例中按顺序对应线索引 0 至 3。</desc>
  <style>
    text { font-family: system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #142d48; }
    .muted { fill: #4c6481; }
    .surface { fill: #f5f8fc; stroke: #c8d5e5; }
    .blue { fill: #dbeafe; stroke: #357aa5; }
    .teal { fill: #d9eee9; stroke: #3a8a76; }
    .gold { fill: #fff2df; stroke: #a67c35; }
    .purple { fill: #f0ebff; stroke: #8865ab; }
    .box { stroke-width: 1.8; }
    .wire { fill: none; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect x="1" y="1" width="838" height="364" rx="19" class="surface"/>
  <text x="36" y="44" font-size="23" font-weight="700">INTx swizzle · 把各插槽的 INTA# 错开</text>
  <text x="36" y="71" font-size="14" class="muted">主板接线示例：四根线依次接到 IOAPIC 的 16–19 号引脚。</text>

  <rect x="36" y="96" width="168" height="78" rx="12" class="blue box"/>
  <rect x="236" y="96" width="168" height="78" rx="12" class="teal box"/>
  <rect x="436" y="96" width="168" height="78" rx="12" class="gold box"/>
  <rect x="636" y="96" width="168" height="78" rx="12" class="purple box"/>
  <g text-anchor="middle">
    <g font-size="21" font-weight="700">
      <text x="120" y="128">Slot 0</text>
      <text x="320" y="128">Slot 1</text>
      <text x="520" y="128">Slot 2</text>
      <text x="720" y="128">Slot 3</text>
    </g>
    <g font-size="18">
      <text x="120" y="154">INTA#</text>
      <text x="320" y="154">INTA#</text>
      <text x="520" y="154">INTA#</text>
      <text x="720" y="154">INTA#</text>
    </g>
  </g>
  <path d="M120 175 V239 M113 230 L120 239 L127 230" class="blue wire"/>
  <path d="M320 175 V239 M313 230 L320 239 L327 230" class="teal wire"/>
  <path d="M520 175 V239 M513 230 L520 239 L527 230" class="gold wire"/>
  <path d="M720 175 V239 M713 230 L720 239 L727 230" class="purple wire"/>

  <rect x="36" y="248" width="168" height="66" rx="12" class="blue box"/>
  <rect x="236" y="248" width="168" height="66" rx="12" class="teal box"/>
  <rect x="436" y="248" width="168" height="66" rx="12" class="gold box"/>
  <rect x="636" y="248" width="168" height="66" rx="12" class="purple box"/>
  <g text-anchor="middle" font-size="20" font-weight="700">
    <text x="120" y="288">Pin 16</text>
    <text x="320" y="288">Pin 17</text>
    <text x="520" y="288">Pin 18</text>
    <text x="720" y="288">Pin 19</text>
  </g>
  <text x="36" y="343" font-size="14" class="muted">线索引从 0 开始；这组接线里，IOAPIC 引脚号 = 16 + 线索引。</text>
</svg>
