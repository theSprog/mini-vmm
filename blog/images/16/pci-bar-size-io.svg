<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" width="840" height="330" viewBox="0 0 840 330" role="img" aria-labelledby="title desc">
  <title id="title">大小探测 · 16 字节 I/O BAR</title>
  <desc id="desc">面向 16 位 I/O 空间的 BAR 写入 0xFFFFFFFF 后读回 0x0000FFF1：31:16 固定为零，15:4 读回全 1，3:2 因对齐固定为零，1 为保留零位，0 为 I/O 类型 1。屏蔽低两位得到 0x0000FFF0，最低置位是 bit 4，对应 16 字节。</desc>
  <style>
    text { font-family: system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
    .ink { fill: #142d48; }
    .muted { fill: #4c6481; }
    .mono { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; }
    .surface { fill: #f5f8fc; stroke: #c8d5e5; }
    .panel { fill: #fff; stroke: #a5b8cc; }
    .res { fill: #e9eff6; stroke: #a5b8cc; }
    .blue { fill: #dbeafe; stroke: #85a9d5; }
    .flag { fill: #fff2df; stroke: #c2a174; }
    .teal { fill: #d9eee9; stroke: #78aca5; }
  </style>
  <rect x="1" y="1" width="838" height="328" rx="19" class="surface"/>
  <text x="36" y="44" font-size="23" font-weight="700" class="ink">大小探测 · 16 字节 I/O BAR</text>
  <text x="36" y="73" font-size="15" class="ink">例：用于 16 位 I/O 空间 · 基址按 16 字节对齐</text>
  <text x="36" y="105" font-size="15" font-weight="700" class="ink">① 写全 1</text>
  <text x="804" y="105" font-size="15" font-weight="700" text-anchor="end" class="ink mono">0xFFFFFFFF</text>
  <rect x="36" y="115" width="768" height="32" class="panel" data-bits="31:0"/>
  <text x="420" y="136" font-size="15" font-weight="700" text-anchor="middle" class="ink">全部 32 位都写入 1</text>
  <text x="36" y="177" font-size="15" font-weight="700" class="ink">② 读回 BAR</text>
  <text x="804" y="177" font-size="15" font-weight="700" text-anchor="end" class="ink mono">0x0000FFF1</text>
  <rect x="36" y="207" width="384" height="34" class="res" data-bits="31:16"/>
  <text x="228" y="197" font-size="12" font-weight="700" text-anchor="middle" class="muted">31:16</text>
  <text x="228" y="229" font-size="15" text-anchor="middle" class="muted">未实现的高 16 位 → 全 0</text>
  <rect x="420" y="207" width="288" height="34" class="blue" data-bits="15:4"/>
  <text x="564" y="197" font-size="12" font-weight="700" text-anchor="middle" class="muted">15:4</text>
  <text x="564" y="229" font-size="15" font-weight="700" text-anchor="middle" class="ink">可写地址位 → 全 1</text>
  <rect x="708" y="207" width="48" height="34" class="res" data-bits="3:2"/>
  <text x="732" y="197" font-size="12" font-weight="700" text-anchor="middle" class="muted">3:2</text>
  <text x="732" y="229" font-size="13" text-anchor="middle" class="muted">00</text>
  <rect x="756" y="207" width="24" height="34" class="res" data-bits="1"/>
  <text x="768" y="197" font-size="12" font-weight="700" text-anchor="middle" class="muted">1</text>
  <text x="768" y="229" font-size="12" text-anchor="middle" class="muted">0</text>
  <rect x="780" y="207" width="24" height="34" class="flag" data-bits="0"/>
  <text x="792" y="197" font-size="12" font-weight="700" text-anchor="middle" class="muted">0</text>
  <text x="792" y="229" font-size="12" font-weight="700" text-anchor="middle" class="ink">1</text>
  <text x="36" y="262" font-size="14" class="ink">3:2 因对齐固定为 0；bit 1 保留为 0，bit 0 固定为 1（I/O 类型）。</text>
  <rect x="36" y="277" width="768" height="34" rx="7" class="teal"/>
  <text x="50" y="299" font-size="14" font-weight="700" class="ink">③ 屏蔽低 2 位 → 0x0000FFF0 → 最低的 1 在 bit 4</text>
  <text x="790" y="299" font-size="14" font-weight="700" text-anchor="end" class="ink">0x10 = 16 字节</text>
</svg>
