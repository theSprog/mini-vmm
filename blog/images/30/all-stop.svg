<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="425" viewBox="0 0 1060 425" role="img" aria-label="All-stop 与选择性恢复并不矛盾">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#65788c"/></marker></defs>
<rect width="1060" height="425" rx="18" fill="#ffffff" stroke="#dce3eb"/>
<text x="30" y="38" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#24384b">All-stop 与选择性恢复并不矛盾</text>
<text x="30" y="65" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#65788c">停止传播策略与恢复范围是两个独立维度。</text>
<text x="275.0" y="99" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#24384b">初始</text>
<rect x="30" y="113" width="490" height="74" rx="10" fill="#e8f4ee" stroke="#39816b" stroke-width="1.5"/>
<text x="275.0" y="144.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#24384b">CPU 0 / 1 / 2 / 3</text>
<text x="275.0" y="167.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#24384b">全部运行</text>
<path d="M275.0 187 L275.0 211" stroke="#65788c" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<rect x="30" y="213" width="490" height="74" rx="10" fill="#fff2db" stroke="#b47b24" stroke-width="1.5"/>
<text x="275.0" y="244.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#24384b">CPU 0 命中断点</text>
<text x="275.0" y="267.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#24384b">请求全体停止</text>
<path d="M275.0 287 L275.0 311" stroke="#65788c" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<rect x="30" y="313" width="490" height="74" rx="10" fill="#eaf2fb" stroke="#4778a6" stroke-width="1.5"/>
<text x="275.0" y="344.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#24384b">全部 parked</text>
<text x="275.0" y="367.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#24384b">统一报告停止原因</text>
<text x="785.0" y="99" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#24384b">选择性恢复</text>
<rect x="540" y="113" width="490" height="74" rx="10" fill="#eaf2fb" stroke="#4778a6" stroke-width="1.5"/>
<text x="785.0" y="144.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#24384b">vCont;c:2;c:3</text>
<text x="785.0" y="167.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#24384b">只恢复 CPU 1 / 2</text>
<path d="M785.0 187 L785.0 211" stroke="#65788c" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<rect x="540" y="213" width="490" height="74" rx="10" fill="#e8f4ee" stroke="#39816b" stroke-width="1.5"/>
<text x="785.0" y="244.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#24384b">CPU 0 / 3 保持暂停</text>
<text x="785.0" y="267.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#24384b">CPU 1 / 2 执行</text>
<path d="M785.0 287 L785.0 311" stroke="#65788c" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<rect x="540" y="313" width="490" height="74" rx="10" fill="#eaf2fb" stroke="#4778a6" stroke-width="1.5"/>
<text x="785.0" y="344.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#24384b">CPU 2 再次命中</text>
<text x="785.0" y="367.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#24384b">全体回到 parked</text>
</svg>