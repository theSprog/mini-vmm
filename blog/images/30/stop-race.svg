<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="425" viewBox="0 0 1060 425" role="img" aria-label="停止请求必须跨越 KVM_RUN 入口竞争窗口">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#65788c"/></marker></defs>
<rect width="1060" height="425" rx="18" fill="#ffffff" stroke="#dce3eb"/>
<text x="30" y="38" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#24384b">停止请求必须跨越 KVM_RUN 入口竞争窗口</text>
<text x="30" y="65" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#65788c">信号负责唤醒，immediate_exit 负责关闭入口，run 表达持续的运行许可。</text>
<text x="190.0" y="99" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#24384b">仅 immediate_exit</text>
<rect x="30" y="113" width="320" height="74" rx="10" fill="#f1f4f7" stroke="#718096" stroke-width="1.5"/>
<text x="190.0" y="144.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#24384b">vCPU 已在 Guest</text>
<text x="190.0" y="167.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#24384b">正在执行或等 SIPI</text>
<path d="M190.0 187 L190.0 211" stroke="#65788c" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<rect x="30" y="213" width="320" height="74" rx="10" fill="#fff2db" stroke="#b47b24" stroke-width="1.5"/>
<text x="190.0" y="244.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#24384b">immediate_exit = 1</text>
<text x="190.0" y="267.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#24384b">共享字段被修改</text>
<path d="M190.0 287 L190.0 311" stroke="#65788c" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<rect x="30" y="313" width="320" height="74" rx="10" fill="#fbecec" stroke="#bd5454" stroke-width="1.5"/>
<text x="190.0" y="344.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#24384b">不能主动唤醒</text>
<text x="190.0" y="367.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#24384b">无法保证及时停止</text>
<text x="530.0" y="99" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#24384b">仅 SIGUSR1</text>
<rect x="370" y="113" width="320" height="74" rx="10" fill="#f1f4f7" stroke="#718096" stroke-width="1.5"/>
<text x="530.0" y="144.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#24384b">vCPU 尚在用户态</text>
<text x="530.0" y="167.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#24384b">即将调用 KVM_RUN</text>
<path d="M530.0 187 L530.0 211" stroke="#65788c" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<rect x="370" y="213" width="320" height="74" rx="10" fill="#fff2db" stroke="#b47b24" stroke-width="1.5"/>
<text x="530.0" y="244.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#24384b">信号先被处理</text>
<text x="530.0" y="267.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#24384b">处理函数不设停止门闩</text>
<path d="M530.0 287 L530.0 311" stroke="#65788c" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<rect x="370" y="313" width="320" height="74" rx="10" fill="#fbecec" stroke="#bd5454" stroke-width="1.5"/>
<text x="530.0" y="344.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#24384b">信号已消费</text>
<text x="530.0" y="367.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#24384b">随后仍可能进入 Guest</text>
<text x="870.0" y="99" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#24384b">二者配合</text>
<rect x="710" y="113" width="320" height="74" rx="10" fill="#eaf2fb" stroke="#4778a6" stroke-width="1.5"/>
<text x="870.0" y="144.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#24384b">run[i] = false</text>
<text x="870.0" y="167.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#24384b">持久停止意图</text>
<path d="M870.0 187 L870.0 211" stroke="#65788c" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<rect x="710" y="213" width="320" height="74" rx="10" fill="#e8f4ee" stroke="#39816b" stroke-width="1.5"/>
<text x="870.0" y="244.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#24384b">immediate_exit = 1</text>
<text x="870.0" y="267.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#24384b">再 pthread_kill()</text>
<path d="M870.0 287 L870.0 311" stroke="#65788c" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<rect x="710" y="313" width="320" height="74" rx="10" fill="#e8f4ee" stroke="#39816b" stroke-width="1.5"/>
<text x="870.0" y="344.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#24384b">EINTR → park</text>
<text x="870.0" y="367.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#24384b">parked[i] = true</text>
</svg>