<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="545" viewBox="0 0 1060 545" role="img" aria-labelledby="title desc">
  <title id="title">GDB stub：三层代码与线程边界</title>
  <desc id="desc">GDB 经 TCP 与 gdbstub 线程收发 RSP。rsp.c 解析协议，调用 gdbstub.c 的 target 回调。vCPU 线程走 KVM 退出处理路径，发布停止事件并写 eventfd，由 gdbstub 线程等待 vCPU 停稳后回复 GDB。两个线程都可调用 x86.c 的辅助函数。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#65788c"/>
    </marker>
  </defs>
  <rect width="1060" height="545" rx="18" fill="#fff" stroke="#dce3eb"/>
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#24384b">
    <text x="30" y="38" font-size="24" font-weight="700">GDB stub：三层代码与线程边界</text>
    <text x="30" y="67" font-size="15" fill="#65788c">GDB 经 TCP 只和 gdbstub 线程收发协议；vCPU 线程不写 socket。</text>

    <rect x="38" y="95" width="427" height="323" rx="12" fill="#f7f9fc" stroke="#c7d5e1"/>
    <rect x="692" y="95" width="330" height="323" rx="12" fill="#f7f9fc" stroke="#c7d5e1"/>
    <text x="59" y="125" font-size="18" font-weight="700">gdbstub 线程</text>
    <text x="713" y="125" font-size="18" font-weight="700">vCPU 线程（每个 vCPU 一条）</text>

    <rect x="58" y="147" width="387" height="82" rx="8" fill="#f1edf9" stroke="#7863a1" stroke-width="1.5"/>
    <text x="76" y="174" font-size="17" font-weight="700">协议层 · rsp.c</text>
    <text x="76" y="201" font-size="15">rsp_feed() 拆包、校验、转义、处理 ack</text>
    <path d="M251 229 V268" fill="none" stroke="#65788c" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="266" y="253" font-size="14" fill="#53687a">target_ops 回调</text>

    <rect x="58" y="269" width="387" height="128" rx="8" fill="#eaf2fb" stroke="#4778a6" stroke-width="1.5"/>
    <text x="76" y="297" font-size="17" font-weight="700">机器后端 · gdbstub.c</text>
    <text x="76" y="323" font-size="15">读寄存器、翻译地址、读写内存、装断点</text>
    <text x="76" y="349" font-size="15">配置 KVM guest debug，协调暂停与放行</text>
    <text x="76" y="375" font-size="15">确认全部停稳后，经 RSP 回复 GDB</text>

    <rect x="712" y="269" width="290" height="128" rx="8" fill="#eaf2fb" stroke="#4778a6" stroke-width="1.5"/>
    <text x="730" y="297" font-size="17" font-weight="700">退出处理 · gdbstub.c</text>
    <text x="730" y="323" font-size="15">处理 KVM_EXIT_DEBUG 或 EINTR</text>
    <text x="730" y="349" font-size="15">调试事件触发全停并写 eventfd</text>
    <text x="730" y="375" font-size="15">停稳后置 parked，等运行许可</text>

    <g fill="none" stroke="#65788c" stroke-width="1.8" marker-end="url(#arr)">
      <path d="M712 315 H446"/>
      <path d="M445 371 H711"/>
      <path d="M251 397 V452"/>
      <path d="M857 397 V452"/>
    </g>
    <g text-anchor="middle" font-size="14" fill="#53687a">
      <text x="578" y="303">eventfd 唤醒 gdbstub</text>
      <text x="578" y="359">恢复时设 run，广播条件变量</text>
      <text x="321" y="439">回调调用</text>
      <text x="925" y="439">退出时调用</text>
    </g>

    <rect x="58" y="453" width="944" height="67" rx="8" fill="#e8f4ee" stroke="#39816b" stroke-width="1.5"/>
    <text x="530" y="479" text-anchor="middle" font-size="17" font-weight="700">共享的 x86 辅助层 · x86.c（随调用方线程执行）</text>
    <text x="530" y="505" text-anchor="middle" font-size="15">断点表、DR7 计算、调试异常归类、寄存器换算；不发 KVM ioctl。</text>
  </g>
</svg>
