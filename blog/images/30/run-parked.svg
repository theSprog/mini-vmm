<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="350" viewBox="0 0 1060 350" role="img" aria-label="run 与 parked：请求和确认的状态机">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#65788c"/></marker></defs>
<rect width="1060" height="350" rx="18" fill="#ffffff" stroke="#dce3eb"/>
<text x="30" y="38" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#24384b">run 与 parked：请求和确认的状态机</text>
<text x="30" y="65" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#65788c">两者由同一把锁保护；条件变量等待时释放锁。</text>
<rect x="30" y="135" width="235" height="85" rx="10" fill="#e8f4ee" stroke="#39816b" stroke-width="1.5"/>
<text x="147.5" y="172.0" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#24384b">运行中</text>
<text x="147.5" y="195.0" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#24384b">run=1 / parked=0</text>
<rect x="285" y="135" width="235" height="85" rx="10" fill="#fff2db" stroke="#b47b24" stroke-width="1.5"/>
<text x="402.5" y="172.0" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#24384b">请求停止</text>
<text x="402.5" y="195.0" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#24384b">run=0 / parked=0</text>
<rect x="540" y="135" width="235" height="85" rx="10" fill="#eaf2fb" stroke="#4778a6" stroke-width="1.5"/>
<text x="657.5" y="172.0" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#24384b">已安全暂停</text>
<text x="657.5" y="195.0" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#24384b">run=0 / parked=1</text>
<rect x="795" y="135" width="235" height="85" rx="10" fill="#f1f4f7" stroke="#718096" stroke-width="1.5"/>
<text x="912.5" y="172.0" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#24384b">请求恢复</text>
<text x="912.5" y="195.0" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#24384b">run=1 / parked=1</text>
<path d="M265 178 L285 178" stroke="#65788c" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<text x="275" y="121" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#24384b">stop</text>
<path d="M520 178 L540 178" stroke="#65788c" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<text x="530" y="121" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#24384b">ack</text>
<path d="M775 178 L795 178" stroke="#65788c" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<text x="785" y="121" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#24384b">resume</text>
<path d="M912 220 V265 H147 V220" stroke="#65788c" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<text x="530" y="289" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#24384b">vCPU 离开条件变量，清 parked 和 immediate_exit 后进入运行循环</text>
<text x="530" y="327" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#39816b">只有全部 vCPU 已确认停在安全点，才允许操作架构状态。</text>
</svg>