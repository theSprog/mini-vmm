<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="475" viewBox="0 0 1060 475" role="img" aria-label="跨越软件断点：原始指令必须执行一次">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#65788c"/></marker></defs>
<rect width="1060" height="475" rx="18" fill="#ffffff" stroke="#dce3eb"/>
<text x="30" y="38" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#24384b">跨越软件断点：原始指令必须执行一次</text>
<text x="30" y="65" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#65788c">一种 all-stop 下的典型原地单步方案；由 GDB / stub 协作编排。</text>
<text x="190.0" y="99" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#24384b">命中</text>
<rect x="30" y="113" width="320" height="74" rx="10" fill="#fbecec" stroke="#bd5454" stroke-width="1.5"/>
<text x="190.0" y="144.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#24384b">CC 01 D8</text>
<text x="190.0" y="167.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#24384b">INT3 → #BP → DEBUG</text>
<path d="M190.0 187 L190.0 211" stroke="#65788c" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<rect x="30" y="213" width="320" height="74" rx="10" fill="#f1f4f7" stroke="#718096" stroke-width="1.5"/>
<text x="190.0" y="244.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#24384b">所有 vCPU 停稳</text>
<text x="190.0" y="267.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#24384b">RIP 指向断点</text>
<text x="530.0" y="99" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#24384b">跨越</text>
<rect x="370" y="113" width="320" height="74" rx="10" fill="#e8f4ee" stroke="#39816b" stroke-width="1.5"/>
<text x="530.0" y="144.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#24384b">48 01 D8</text>
<text x="530.0" y="167.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#24384b">恢复原字节</text>
<path d="M530.0 187 L530.0 211" stroke="#65788c" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<rect x="370" y="213" width="320" height="74" rx="10" fill="#eaf2fb" stroke="#4778a6" stroke-width="1.5"/>
<text x="530.0" y="244.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#24384b">只放行目标 vCPU</text>
<text x="530.0" y="267.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#24384b">TF 单步执行 ADD</text>
<path d="M530.0 287 L530.0 311" stroke="#65788c" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<rect x="370" y="313" width="320" height="74" rx="10" fill="#f1edf9" stroke="#7863a1" stroke-width="1.5"/>
<text x="530.0" y="344.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#24384b">#DB</text>
<text x="530.0" y="367.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#24384b">ADD 已提交</text>
<text x="870.0" y="99" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#24384b">重新布置</text>
<rect x="710" y="113" width="320" height="74" rx="10" fill="#fbecec" stroke="#bd5454" stroke-width="1.5"/>
<text x="870.0" y="144.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#24384b">CC 01 D8</text>
<text x="870.0" y="167.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#24384b">重新插入断点</text>
<path d="M870.0 187 L870.0 211" stroke="#65788c" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<rect x="710" y="213" width="320" height="74" rx="10" fill="#e8f4ee" stroke="#39816b" stroke-width="1.5"/>
<text x="870.0" y="244.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#24384b">恢复所选 vCPU</text>
<text x="870.0" y="267.5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#24384b">继续执行下一条指令</text>
<text x="530.0" y="451" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#39816b">其他 vCPU 在原字节暂时恢复期间必须受到控制，以免漏过断点。</text>
</svg>