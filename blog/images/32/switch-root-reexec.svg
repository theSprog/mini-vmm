<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img">
<title>PID 不变，根目录与地址空间改变</title><desc>两列是同一 PID 1 的两个状态；中间的 FD 表达必要状态传递。</desc>
<defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#213247"/></marker><marker id="muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#52677c"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#2463a3"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#237b68"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#a35c18"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#b34848"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#667b90"/></marker></defs>
<rect width="1000" height="450" rx="12" fill="#ffffff"/>
<text x="28" y="35" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#213247" text-anchor="start">PID 不变，根目录与地址空间改变</text>
<text x="28" y="62" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#52677c" text-anchor="start">两列是同一 PID 1 的两个状态；中间的 FD 表达必要状态传递。</text>
<polyline points="28,76 972,76" fill="none" stroke="#667b90" stroke-width="1" stroke-linejoin="round"/>
<rect x="28" y="97" width="350" height="250" rx="8" fill="#fafcfe" stroke="#a35c18" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="41" y="121" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#a35c18" text-anchor="start">initramfs 状态</text>
<rect x="46" y="140" width="314" height="65" rx="8" fill="#fff3df" stroke="#a35c18" stroke-width="1.4"/>
<text x="203" y="168" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">PID 1 · systemd A</text>
<text x="203" y="190" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#52677c" text-anchor="middle">不同 ELF / 动态库映射</text>
<rect x="46" y="254" width="314" height="55" rx="8" fill="#fff3df" stroke="#a35c18" stroke-width="1.4"/>
<text x="203" y="287" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">root → 内存 rootfs</text>
<polyline points="203,205 203,254" fill="none" stroke="#a35c18" stroke-width="2" stroke-linejoin="round"/>
<rect x="622" y="97" width="350" height="250" rx="8" fill="#fafcfe" stroke="#237b68" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="635" y="121" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#237b68" text-anchor="start">真根状态</text>
<rect x="640" y="140" width="314" height="65" rx="8" fill="#e9f6f0" stroke="#237b68" stroke-width="1.4"/>
<text x="797" y="168" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">PID 1 · systemd B</text>
<text x="797" y="190" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#52677c" text-anchor="middle">不同 ELF / 动态库映射</text>
<rect x="640" y="254" width="314" height="55" rx="8" fill="#e9f6f0" stroke="#237b68" stroke-width="1.4"/>
<text x="797" y="287" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">root → ext4 on sda</text>
<polyline points="797,205 797,254" fill="none" stroke="#237b68" stroke-width="2" stroke-linejoin="round"/>
<rect x="399" y="153" width="202" height="75" rx="8" fill="#eaf3fc" stroke="#2463a3" stroke-width="1.4"/>
<text x="500" y="186" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">序列化 FD</text>
<text x="500" y="208" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#52677c" text-anchor="middle">保留必要状态</text>
<polyline points="360,172 399,172" fill="none" stroke="#2463a3" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue)"/>
<polyline points="601,172 640,172" fill="none" stroke="#2463a3" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="500" y="260" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#213247" text-anchor="middle">execve 替换地址空间</text>
<rect x="28" y="365" width="944" height="48" rx="8" fill="#eaf3fc" stroke="#2463a3" stroke-width="1.4"/>
<text x="500" y="395" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">共享内核对象：PID 身份 / 已加载模块 / PCI 设备 / IRQ</text>
<text x="28" y="432" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#52677c" text-anchor="start">不是两个同时运行的 PID 1；私有序列化格式的跨版本兼容性并非无条件保证。</text>
</svg>