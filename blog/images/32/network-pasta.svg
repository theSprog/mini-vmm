<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img">
<title>pasta 在线网络：桥接与用户态 socket</title><desc>两个 TAP 是 bridge 的端口；pasta 在另一侧用 Host socket 收发 TCP/UDP。</desc>
