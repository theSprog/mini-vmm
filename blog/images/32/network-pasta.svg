<text x="28" y="452" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#52677c" text-anchor="start">pasta 内建 DHCP，网关 192.168.8.1；不是在 namespace 中另配 NAT 或 dnsmasq。</text>
