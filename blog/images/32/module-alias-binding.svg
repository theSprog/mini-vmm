<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img">
<title>一份 PCI ID 表，两种匹配关系</title><desc>自动加载解决“找到模块”；PCI core 解决“设备与已注册驱动绑定”。</desc>
<defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#213247"/></marker><marker id="muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#52677c"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#2463a3"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#237b68"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#a35c18"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#b34848"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#667b90"/></marker></defs>
<rect width="1000" height="470" rx="12" fill="#ffffff"/>
<text x="28" y="35" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#213247" text-anchor="start">一份 PCI ID 表，两种匹配关系</text>
<text x="28" y="62" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#52677c" text-anchor="start">自动加载解决“找到模块”；PCI core 解决“设备与已注册驱动绑定”。</text>
<polyline points="28,76 972,76" fill="none" stroke="#667b90" stroke-width="1" stroke-linejoin="round"/>
<rect x="350" y="95" width="300" height="48" rx="8" fill="#eaf3fc" stroke="#2463a3" stroke-width="1.4"/>
<text x="500" y="125" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">驱动源码：pci_device_id[]</text>
<rect x="28" y="168" width="444" height="250" rx="8" fill="#fafcfe" stroke="#a35c18" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="41" y="192" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#a35c18" text-anchor="start">构建产物与用户态索引</text>
<rect x="528" y="168" width="444" height="250" rx="8" fill="#fafcfe" stroke="#237b68" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="541" y="192" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#237b68" text-anchor="start">运行中的内核对象</text>
<rect x="48" y="208" width="414" height="60" rx="8" fill="#fff3df" stroke="#a35c18" stroke-width="1.4"/>
<text x="255" y="234" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">MODULE_DEVICE_TABLE / modpost</text>
<text x="255" y="256" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#52677c" text-anchor="middle">.ko 的 alias 元数据</text>
<rect x="48" y="310" width="414" height="68" rx="8" fill="#fff3df" stroke="#a35c18" stroke-width="1.4"/>
<text x="255" y="340" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">depmod / modules.alias</text>
<text x="255" y="362" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#52677c" text-anchor="middle">modalias → e1000.ko</text>
<rect x="537" y="208" width="414" height="60" rx="8" fill="#e9f6f0" stroke="#237b68" stroke-width="1.4"/>
<text x="744" y="234" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">pci_driver.id_table</text>
<text x="744" y="256" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#52677c" text-anchor="middle">注册后的驱动匹配表</text>
<rect x="537" y="310" width="414" height="68" rx="8" fill="#eaf3fc" stroke="#2463a3" stroke-width="1.4"/>
<text x="744" y="340" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">struct pci_dev</text>
<text x="744" y="362" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#52677c" text-anchor="middle">vendor/device/class + modalias</text>
<polyline points="425,143 255,143 255,208" fill="none" stroke="#a35c18" stroke-width="2" stroke-linejoin="round" marker-end="url(#orange)"/>
<polyline points="575,143 744,143 744,208" fill="none" stroke="#237b68" stroke-width="2" stroke-linejoin="round" marker-end="url(#green)"/>
<polyline points="255,268 255,310" fill="none" stroke="#a35c18" stroke-width="2" stroke-linejoin="round" marker-end="url(#orange)"/>
<polyline points="744,268 744,310" fill="none" stroke="#237b68" stroke-width="2" stroke-linejoin="round" marker-end="url(#green)" marker-start="url(#green)"/>
<polyline points="537,350 462,350" fill="none" stroke="#2463a3" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="500" y="337" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#2463a3" text-anchor="middle">查索引</text>
<text x="28" y="452" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#52677c" text-anchor="start">删除 MODULE_DEVICE_TABLE 不等于删除运行时 id_table；显式 modprobe 仍可能正常绑定。</text>
</svg>