<text x="500" y="424" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">Host：mini-vmm UART</text>
<polyline points="500,367 500,397" fill="none" stroke="#667b90" stroke-width="2" stroke-linejoin="round" marker-end="url(#gray)" marker-start="url(#gray)"/>
<text x="28" y="462" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#52677c" text-anchor="start">getty-generator 读取活动 console 信息；普通 TTY 与 printk 不共享完全相同的调用链。</text>
</svg>