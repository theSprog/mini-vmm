<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img">
<title>事件不是设备对象：coldplug 的重放边界</title><desc>用户态规则环境更换，但内核设备对象与 sysfs 身份保持不变。</desc>
<defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#213247"/></marker><marker id="muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#52677c"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#2463a3"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#237b68"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#a35c18"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#b34848"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#667b90"/></marker></defs>
<rect width="1000" height="460" rx="12" fill="#ffffff"/>
<text x="28" y="35" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#213247" text-anchor="start">事件不是设备对象：coldplug 的重放边界</text>
<text x="28" y="62" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#52677c" text-anchor="start">用户态规则环境更换，但内核设备对象与 sysfs 身份保持不变。</text>
<polyline points="28,76 972,76" fill="none" stroke="#667b90" stroke-width="1" stroke-linejoin="round"/>
<rect x="28" y="95" width="944" height="152" rx="8" fill="#fafcfe" stroke="#667b90" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="41" y="119" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#667b90" text-anchor="start">用户态</text>
<rect x="48" y="139" width="262" height="72" rx="8" fill="#fff3df" stroke="#a35c18" stroke-width="1.4"/>
<text x="179" y="171" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">initramfs udev</text>
<text x="179" y="193" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#52677c" text-anchor="middle">有限模块与规则</text>
<rect x="370" y="139" width="260" height="72" rx="8" fill="#f0f4f8" stroke="#667b90" stroke-width="1.4"/>
<text x="500" y="171" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">udevadm trigger</text>
<text x="500" y="193" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#52677c" text-anchor="middle">遍历 sysfs / 写 uevent</text>
<rect x="690" y="139" width="262" height="72" rx="8" fill="#e9f6f0" stroke="#237b68" stroke-width="1.4"/>
<text x="821" y="171" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">真根 udev</text>
<text x="821" y="193" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#52677c" text-anchor="middle">完整模块与规则</text>
<rect x="28" y="260" width="944" height="146" rx="8" fill="#fafcfe" stroke="#2463a3" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="41" y="284" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#2463a3" text-anchor="start">同一个 Linux 内核</text>
<rect x="48" y="305" width="320" height="62" rx="8" fill="#eaf3fc" stroke="#2463a3" stroke-width="1.4"/>
<text x="208" y="332" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">sysfs / PCI device</text>
<text x="208" y="354" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#52677c" text-anchor="middle">struct pci_dev / modalias</text>
<rect x="628" y="305" width="324" height="62" rx="8" fill="#eaf3fc" stroke="#2463a3" stroke-width="1.4"/>
<text x="790" y="332" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#213247" text-anchor="middle">uevent / netlink</text>
<text x="790" y="354" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#52677c" text-anchor="middle">按当前设备对象生成事件</text>
<polyline points="500,211 500,280 208,280 208,305" fill="none" stroke="#667b90" stroke-width="2" stroke-linejoin="round" marker-end="url(#gray)"/>
<polyline points="368,336 628,336" fill="none" stroke="#2463a3" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="498" y="325" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#2463a3" text-anchor="middle">触发事件</text>
<polyline points="708,305 708,239 179,239 179,211" fill="none" stroke="#a35c18" stroke-width="2" stroke-linejoin="round" marker-end="url(#orange)" stroke-dasharray="6 5"/>
<polyline points="820,305 820,211" fill="none" stroke="#237b68" stroke-width="2" stroke-linejoin="round" marker-end="url(#green)"/>
<text x="28" y="442" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#52677c" text-anchor="start">两轮 udev 分别使用各自规则；事件路径是阶段性的，图不表示两套 udev 同时运行。</text>
</svg>