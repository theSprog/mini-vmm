<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" width="840" height="388" viewBox="0 0 840 388" role="img" aria-labelledby="title desc">
  <title id="title">模拟设备：一台寄存器状态机</title>
  <desc id="desc">输入有 guest 写寄存器、读寄存器请求，以及外部事件。状态包含寄存器、FIFO 和模式位。读可能改变状态且会返回值。设备还可产生副作用并更新中断线电平。</desc>
  <style>
    text { font-family: system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
    .ink { fill: #142d48; }
    .muted { fill: #4c6481; }
    .white { fill: #fff; }
    .goldText { fill: #784417; }
    .tealText { fill: #20534a; }
    .surface { fill: #f5f8fc; stroke: #c8d5e5; }
    .panel { fill: #fff; stroke: #a5b8cc; }
    .navy { fill: #183a5a; }
    .blue { fill: #dbeafe; stroke: #85a9d5; }
    .flag { fill: #fff2df; stroke: #c2a174; }
    .res { fill: #e9eff6; stroke: #a5b8cc; }
    .teal { fill: #d9eee9; stroke: #78aca5; }
    .purple { fill: #f0ebff; stroke: #a397d1; }
    .line, .faint, .accent, .tealWire, .dash { fill: none; }
    .line { stroke: #58728d; stroke-width: 1.5; }
    .faint { stroke: #bdcbd9; }
    .accent { stroke: #925520; stroke-width: 2; }
    .tealWire { stroke: #326e64; stroke-width: 2; }
    .dash { stroke: #7589a0; stroke-width: 1.4; stroke-dasharray: 4 4; }
    .pad { fill: #f5f8fc; stroke: #58728d; }
    .tap { fill: #925520; stroke: #fff2df; }
    .tapTeal { fill: #326e64; stroke: #e5f5f2; }
  </style>
  <rect x="1" y="1" width="838" height="386" rx="19" class="surface"/>
  <text x="36" y="44" font-size="23" font-weight="700" text-anchor="start" class="ink">模拟设备：一台寄存器状态机</text>
  <defs>
    <marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#58728d"/>
    </marker>
    <marker id="rx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#326e64"/>
    </marker>
    <marker id="irq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#925520"/>
    </marker>
  </defs>
  <text x="36" y="72" font-size="15" font-weight="400" text-anchor="start" class="ink">guest 看到的是寄存器；VMM 保存状态，并按规则处理每次访问。</text>
  <rect x="36" y="109" width="187" height="174" rx="10" class="panel"/>
  <text x="52" y="134" font-size="17" font-weight="700" text-anchor="start" class="ink">Guest</text>
  <text x="52" y="155" font-size="12" font-weight="400" text-anchor="start" class="muted">KVM_EXIT_IO / MMIO</text>
  <rect x="328" y="109" width="238" height="211" rx="12" class="blue"/>
  <text x="347" y="139" font-size="17" font-weight="700" text-anchor="start" class="ink">VMM 设备模型</text>
  <text x="347" y="167" font-size="14" font-weight="700" text-anchor="start" class="ink">当前状态</text>
  <rect x="346" y="178" width="202" height="35" rx="6" class="panel"/>
  <text x="447" y="201" font-size="14" font-weight="700" text-anchor="middle" class="ink">寄存器 · FIFO · 模式位</text>
  <text x="347" y="237" font-size="14" font-weight="700" text-anchor="start" class="ink">处理请求或外部事件</text>
  <path d="M347 247H546" class="faint"/>
  <text x="347" y="271" font-size="14" font-weight="700" text-anchor="start" class="ink">保存新状态、生成响应</text>
  <text x="347" y="294" font-size="13" font-weight="400" text-anchor="start" class="muted">读操作也可能改变状态</text>
  <path d="M223 174H326" class="line" marker-end="url(#data)"/>
  <path d="M223 218H326" class="line" marker-end="url(#data)"/>
  <path d="M328 260H225" class="tealWire" marker-end="url(#rx)"/>
  <text x="212" y="179" font-size="14" font-weight="700" text-anchor="end" class="ink">写请求</text>
  <text x="212" y="223" font-size="14" font-weight="700" text-anchor="end" class="ink">读请求</text>
  <text x="212" y="265" font-size="14" font-weight="700" text-anchor="end" class="tealText">读返回值</text>
  <rect x="36" y="302" width="187" height="43" rx="8" class="teal"/>
  <text x="52" y="329" font-size="14" font-weight="700" text-anchor="start" class="ink">外部事件 · 如 host 输入</text>
  <path d="M223 324H277V301H326" class="tealWire" marker-end="url(#rx)"/>
  <path d="M566 192H623" class="line" marker-end="url(#data)"/>
  <path d="M566 270H623" class="accent" marker-end="url(#irq)"/>
  <rect x="625" y="165" width="179" height="56" rx="8" class="panel"/>
  <text x="639" y="188" font-size="15" font-weight="700" text-anchor="start" class="ink">副作用</text>
  <text x="639" y="208" font-size="13" font-weight="400" text-anchor="start" class="ink">输出字节、开始传输…</text>
  <rect x="625" y="243" width="179" height="56" rx="8" class="flag"/>
  <text x="639" y="266" font-size="15" font-weight="700" text-anchor="start" class="ink">中断线电平</text>
  <text x="639" y="286" font-size="13" font-weight="400" text-anchor="start" class="goldText">KVM_IRQ_LINE</text>
</svg>
